  {th:"disruption", s:"@OReilly", t:"Microsoft эпохи stack ranking: «мы хотели раздавить всех конкурентов — а раздавив, начали давить друг друга». 90% сотрудников хранили верность Windows, когда рынок ушёл 10:1.", d:"Stack ranking заставлял каждую команду ежегодно объявлять часть своих людей худшими — и сотрудники начали конкурировать друг с другом, а не с рынком. Когда внешние враги были раздавлены, культура агрессии повернулась внутрь: подразделения прятали информацию и топили чужие продукты. Пока внутри шла война за рейтинг и лояльность Windows, рынок ушёл в мобильные устройства с перевесом 10:1 — Microsoft пропустил смартфоны и получил «потерянное десятилетие», которое закончилось лишь когда Наделла отменил stack ranking и сменил врага с коллеги на конкурента."},
  {th:"disruption", s:"@OReilly", t:"Швейцарцы сами изобрели кварцевые часы — и сами их отвергли: каждый функционал сказал локально рациональное «нет». Компанию убивает сумма рациональных «нет»; итог — минус 60 000 рабочих мест.", d:"К концу 1960-х швейцарцы доминировали на мировом рынке часов и сами же, в исследовательском центре в Невшателе, создали кварцевый механизм. Но маркетинг сказал «клиент любит механику», производство — «наши активы заточены под шестерёнки», дистрибуция — «ювелиры не станут продавать электронику»: каждое «нет» было локально рациональным. Кварц подхватили Seiko и Casio, и за десятилетие отрасль потеряла порядка 60 000 рабочих мест из 90 000. Дизрапция редко приходит незамеченной — компанию убивает не слепота, а сумма разумных возражений."},
  {th:"disruption", s:"@OReilly", t:"Компании банкротятся не из-за технологий, а из-за лидеров, не умеющих играть в две игры одновременно — эксплуатировать сегодняшний бизнес и исследовать завтрашний.", d:"Технология почти никогда не застаёт врасплох: Kodak сам изобрёл цифровую камеру, Blockbuster мог купить Netflix за $50 млн — и оба всё видели. Гибнут не от незнания, а от неспособности лидеров играть в две игры сразу: exploit требует дисциплины, маржи и предсказуемости, explore — экспериментов, провалов и других метрик, и эти режимы враждуют под одной крышей. Ambidextrous-организация по О'Райли и Ташману держит оба режима одновременно, и разруливать их конфликт обязана лично топ-команда — больше некому."},
  {th:"disruption", s:"@OReilly", t:"«Мне два года до пенсии, и бонус привязан к акциям — я не буду этого делать»: трансформацию блокирует структура вознаграждения, а не слепота.", d:"О'Райли пересказывает признание топ-менеджера: угрозу он видел прекрасно, но до пенсии два года, бонус привязан к курсу акций, а трансформация просадит их раньше, чем даст плоды. Это не когнитивная слепота, а трезвый расчёт внутри неверно настроенной системы. Пока вознаграждение топов привязано к краткосрочным результатам ядра, любой explore будет рационально отвергнут — поэтому менять надо не людей на «более смелых», а структуру стимулов и горизонт, за который платят."},
  {th:"disruption", s:"@OReilly", t:"<q>If you know it's going to work in advance, it is not an experiment</q> (Безос): нужны провалы в новом и непроверенном, а не брак в отлаженном.", d:"Безос разделяет два типа провалов: операционный брак в отлаженном бизнесе непростителен, а провал эксперимента — это купленная информация. Fire Phone стал громким фиаско, но та же готовность ошибаться дала AWS, Kindle и Prime — портфель окупает всё. Лакмус простой: если среди ваших «экспериментов» нет провалов, вы ставите только на заведомо работающее, то есть не экспериментируете вовсе."},
  {th:"disruption", s:"@OReilly", t:"Инновациям нужно «много путей к да»: в корпорации пять уровней могут сказать «нет», стартапу хватает одного «да» из двадцати фондов. Эксперименты дёшевы — дорого становится, когда они срабатывают.", d:"В корпорации идея должна пройти цепочку согласований, где каждый из пяти уровней может её убить, — а стартапу достаточно одного «да» от одного из двадцати фондов. Поэтому экосистема стабильно обыгрывает отдельную фирму: у неё много дверей к «да». Отсюда дизайн IBM Emerging Business Opportunities и амазоновских механизмов — создать внутри компании несколько независимых путей для идеи в обход вертикали. И вторая половина мысли: сами эксперименты дёшевы, настоящие деньги и конфликт с ядром начинаются тогда, когда эксперимент сработал."},
  {th:"disruption", s:"@OReilly", t:"400 идей — 1 в рынке: компании умирают не на генерации, а на масштабировании, потому что оно отнимает ресурсы у действующего бизнеса.", d:"Воронка инноваций беспощадна — из сотен идей рынка достигают единицы, но узкое место не там, где кажется. Генерировать компании умеют: хакатоны и лаборатории есть у всех. Умирают на фазе scaling, когда новый бизнес начинает требовать людей, капитал и внимание у прибыльного ядра — и ядро в этой борьбе всегда сильнее. IBM ответила программой Emerging Business Opportunities: защищённое финансирование, отдельные метрики и кураторство топов, чтобы росток не задушили в момент пересадки."},
  {th:"disruption", s:"@OReilly", t:"Задача лидера — не предсказать будущее, а построить организацию, которая его обнаружит: Amazon не предсказал AWS — открыл его.", d:"AWS не значился ни в одном стратегическом плане: Amazon строил инфраструктуру для себя, заметил чужой спрос на неё — и имел механизмы, чтобы превратить наблюдение в бизнес: PR/FAQ, two-pizza команды, культуру дешёвых экспериментов. О'Райли переворачивает роль лидера: прогнозы всё равно врут, поэтому задача — не угадать будущее, а построить организацию с сенсорами и свободой действовать, которая обнаружит будущее раньше конкурентов и успеет на него поставить."},
  {impl:true, th:"creativity", s:"@Wheeler", t:"Пространство решений задаётся формулировкой проблемы: «ручка для космоса» — одно решение, «записывать информацию в космосе» — целый веер. Абстрагируй проблему через «5 почему».", d:"Классическая иллюстрация — космическая ручка: если задача звучит как <q>сделать ручку, пишущую в невесомости</q>, ответ один — дорогая ручка с картриджем под давлением; если как <q>записывать информацию в космосе</q> — открывается веер от карандаша до диктофона. Формулировка проблемы незаметно отсекает большую часть пространства решений ещё до начала поиска. Практика: прежде чем генерировать идеи, поднимись по лестнице абстракции через <b>5 почему</b> — спрашивай, зачем на самом деле нужно то, что просят, пока не дойдёшь до настоящей потребности, и генерируй решения уже на этом уровне."},
  {th:"creativity", s:"@Wheeler", t:"«Идеи кончились» — ложный сигнал: лучшие идеи приходят после того, как стало трудно. Качество лучшей идеи коррелирует с общим количеством.", d:"Ощущение <q>всё, идеи кончились</q> — не сигнал остановиться, а отметка, где заканчиваются очевидные варианты и начинаются интересные: первые идеи у всех примерно одинаковы, оригинальное появляется после того, как исчерпан стандартный слой. Исследования генерации идей показывают: люди систематически недооценивают, сколько ещё придумают, если продолжат после точки дискомфорта, а качество лучшей идеи растёт вместе с общим числом попыток. Поэтому количество — не враг качества, а его условие: хочешь одну великую идею — заставь себя выдать много посредственных."},
  {th:"creativity", s:"@Wheeler", t:"Правило Клиза: если решение можно принять в понедельник — не принимай его сегодня. Дискомфорт незакрытого вопроса — это инкубация, а не нерешительность.", d:"Джон Клиз сформулировал контринтуитивное правило творческой работы: если решение можно отложить до понедельника — не принимай его сегодня. Пока вопрос открыт, подсознание продолжает над ним работать, и в понедельник решение оказывается лучше пятничного; закрыв вопрос раньше срока, ты покупаешь комфорт ценой качества. Неприятное зудящее чувство незакрытой задачи — это не нерешительность, а идущая инкубация; умение его выдерживать отличает креативных людей от тех, кто хватается за первый приемлемый вариант."},
  {impl:true, th:"creativity", s:"@Wheeler", t:"Генератор и судья в голове не работают одновременно: включил оценку — генерация встала. Разноси во времени: половина встречи — только идеи, вторая — только отбор.", d:"Генерация и оценка — два разных когнитивных режима, и включённый внутренний судья мгновенно останавливает поток идей: люди начинают цензурировать варианты до того, как те успели прозвучать. Именно поэтому классический брейншторм так часто вырождается в осторожный обмен банальностями — критика и придумывание идут вперемешку. Практика: жёстко разноси режимы во времени — первая половина встречи только генерация, любые идеи без единого <q>но</q>, вторая — только отбор; то же правило работает и в одиночку: пиши черновик не редактируя, редактируй не дописывая."},
  {th:"creativity", s:"@Wheeler", t:"Инструкция «придумайте креативные варианты» даёт меньше креативных идей, чем простое «придумайте варианты»: требование оригинальности ломает процесс.", d:"Парадоксальный экспериментальный результат: группа с инструкцией <q>придумайте креативные варианты</q> выдаёт менее оригинальные идеи, чем группа с простым <q>придумайте варианты</q>. Требование оригинальности включает самоконтроль — человек начинает оценивать каждую идею на достаточную креативность ещё до её появления, и генератор глохнет; это тот же механизм, из-за которого команда <q>расслабься</q> заставляет напрячься. Вывод для руководителя: не требуй от команды гениальности — снимай давление, проси просто варианты, и оригинальность придёт сама как побочный продукт объёма."},
  {th:"creativity", s:"@Wheeler", t:"Мы тестируем гипотезы подтверждающе (задача «2-4-6»): предлагаем только примеры под свою теорию. Специально проверяй то, что должно сломать твою версию.", d:"В задаче Уэйсона <q>2-4-6</q> людям называют тройку чисел и просят угадать правило, предлагая свои тройки: почти все, решив, что правило — чётные с шагом два, проверяют только подтверждающие примеры вроде 8-10-12 и уверенно называют неверный ответ, хотя настоящее правило — просто возрастающие числа. Ошибка не в гипотезе, а в стратегии проверки: мы инстинктивно ищем подтверждения и не предлагаем примеры, способные нас опровергнуть. В бизнесе то же самое: пилот, спроектированный чтобы доказать идею, всегда её докажет — специально конструируй тест, который должен сломать твою версию, и только выживание после него чего-то стоит."},
  {th:"creativity", s:"@Wheeler", t:"Прорывы — продукт неэффективного процесса: Флеминг посмотрел на испорченную чашку и сказал «хм?», а не «не получилось». Готовность отвлечься — навык, а не потеря фокуса.", d:"Флеминг увидел плесень, убившую бактерии в испорченной чашке Петри, и вместо <q>эксперимент не удался, выбросить</q> сказал <q>хм, любопытно</q> — так появился пенициллин. Прорывы почти всегда рождаются на обочине основного процесса: у идеально эффективной работы, где каждая минута расписана под план, нет слотов для аномалий и случайных находок. Готовность отвлечься на странное — не потеря фокуса, а отдельный навык: аномалия несёт больше информации, чем подтверждение, но замечает её только тот, кто оставил себе слабину в расписании."},
  {th:"creativity", s:"@Wheeler", t:"Креативность — охота за грибами, а не бухгалтерия: нет операций, гарантирующих результат, есть условия, повышающие вероятность. «Научившись видеть грибы — видишь их везде».", d:"Метафора Уилера: бухгалтерия — это операции с гарантированным результатом, правильно сложил — получил баланс; за грибами так не сходишь. Нельзя выполнить последовательность шагов, гарантирующую великую идею, — можно лишь пойти в правильный лес в правильный сезон, то есть создать условия, повышающие вероятность находки: насмотренность, инкубацию, объём попыток, разведение генерации и оценки. И как грибник, однажды научившийся видеть грибы, начинает видеть их везде, так и натренированный на поиск возможностей взгляд находит их там, где остальные проходят мимо. Ошибка менеджеров — требовать от творчества бухгалтерской предсказуемости: управлять можно условиями, а не результатом."},
  {th:"culture", s:"@OReilly", t:"«Замёрзшая глина»: в слияниях топы выравниваются первыми, а средний менеджмент застывает. Убирать тех, кто не принимает новое поведение, надо быстрее, чем комфортно.", d:"Метафора трансформаций и слияний: организация — глина, схватывающаяся слоями. Топ-команда выравнивается первой — она сама писала новые правила; рядовые сотрудники следуют за средой; а средний менеджмент «замерзает» — у него больше всех вложено в старый порядок и меньше всех выгод от нового. О'Райли жёсток: тех, кто демонстративно не принимает новое поведение, нужно убирать быстрее, чем комфортно, — каждый месяц их присутствия сигналит остальным, что изменение опционально."},
  {impl:true, th:"culture", s:"@OReilly", t:"Тактики Наделлы пакетом: раздал топам «Ненасильственное общение», 9 месяцев слушал сотрудников (что сохранить / что менять / что мешает), нашёл внутренних инфлюенсеров по метаданным email независимо от ранга, убил stack ranking и ввёл «культурное интервью» для повышения в VP.", d:"Разбор трансформации Microsoft показывает: сработал пакет, а не жест. Наделла раздал топ-команде «Ненасильственное общение» как общий язык, девять месяцев слушал сотрудников по трём вопросам — что сохранить, что менять, что мешает, — нашёл настоящих инфлюенсеров по метаданным переписки независимо от ранга, демонтировал stack ranking, стравливавший людей, и сделал культурное интервью фильтром на повышение в VP. <b>Практика:</b> проектируй изменение как систему ходов, закрывающую все рычаги LEASH, — одиночная инициатива, даже яркая, культуру не сдвинет."},
  {th:"culture", s:"@OReilly", t:"Бетьюн перекрасил самолёты и сжёг регламент на парковке: «если рабочее место выглядит как у лузера — сотрудники чувствуют себя лузерами», а сожжённая книга правил — сигнал «используйте собственное суждение».", d:"Первые ходы Бетьюна в Continental были символическими: срочно перекрасить облезлый разномастный флот — потому что <q>если рабочее место выглядит как у лузера, люди чувствуют себя лузерами</q> — и публично сжечь на парковке толстый корпоративный регламент. Сожжённая книга правил сказала громче любого меморандума: мы доверяем вашему суждению в интересах клиента. Символы — самый быстрый канал культурной коммуникации: их считывают мгновенно и пересказывают годами."},
  {impl:true, th:"culture", s:"@OReilly", t:"«Круг благодарности»: даже в жёсткий кризис ритуал «за что мы благодарны» сдвигает культуру команды из пессимизма в оптимизм (кейс ливанского финансового кризиса).", d:"Пример из курса: команда в Ливане в разгар финансового кризиса — банки заморожены, горизонт планирования нулевой — ввела ритуал начинать каждую встречу кругом «за что мы благодарны». Простая практика систематически смещала фокус группы с потерь на ресурсы и удерживала людей в действии, когда контекст толкал в паралич. <b>Практика:</b> в кризис не жди подходящего настроения — встрой благодарность как обязательный ритуал открытия встреч; культура команды складывается из повторяемых микроритуалов, а не из обстоятельств."},
  {impl:true, th:"disruption", s:"@OReilly", t:"Amazon работает задом наперёд — PR/FAQ: прежде чем строить, напиши пресс-релиз и FAQ будущего продукта. Это форсирует ясность о проблеме клиента, а не о технологии.", d:"Механика working backwards: до единой строчки кода команда пишет пресс-релиз будущего продукта на языке клиента и FAQ с самыми неудобными вопросами. Если пресс-релиз скучен, а проблема клиента не формулируется в одном абзаце — продукт не строят; через это сито прошли Kindle и AWS. Фокус смещается с «какая у нас классная технология» на «чью боль мы снимаем». <b>Практика:</b> перед следующей инициативой напиши одну страницу пресс-релиза и честный FAQ — половина идей умрёт на бумаге, и это самая дешёвая из возможных смертей."},
  {impl:true, th:"disruption", s:"@OReilly", t:"Три фазы инноваций — три разные дисциплины: Ideation (PR/FAQ) → Incubation (изолированные «2-pizza» команды, защищённые от ядра) → Scaling (перенос в ядро). Компании путают их — и умирают на стыках.", d:"Ideation, Incubation и Scaling — не стадии одного конвейера, а три разных ремесла с разными метриками: на идеации важна ясность о клиенте (PR/FAQ), на инкубации — скорость обучения и защита от ядра (изолированные two-pizza команды), на масштабировании — наоборот, доступ к активам и каналам ядра. Компании гибнут на стыках: судят инкубацию по выручке или оставляют выстреливший эксперимент без ресурсов большой машины. <b>Практика:</b> для каждой инициативы явно назови фазу и проверь, что метрики, команда и степень изоляции соответствуют именно ей, а не соседней."},
  {impl:true, th:"disruption", s:"@OReilly", t:"Distance matters: строя будущее, физически отдели инновационную команду от штаб-квартиры — культура ядра убьёт explore-инициативу. И отправь туда сильного лидера, а не «кого не жалко».", d:"Explore-команда внутри штаб-квартиры обречена: её меряют метриками ядра, лучших людей забирают на «горящее», а согласования съедают темп. Классический ход — IBM вынесла разработку PC в отдельную команду в Бока-Ратоне, подальше от корпоративных процессов, и уложилась в год. Вторая типовая ошибка — отправлять в новое «кого не жалко»: организация мгновенно считывает, что ставка несерьёзна. <b>Практика:</b> выноси инициативу структурно и физически, дай ей собственные правила — и отправь туда лидера, потерю которого ядро реально почувствует."},
  {th:"disruption", s:"@OReilly", t:"Ball Corporation с 1880 года: деревянные вёдра → стеклянные банки → жестяные банки → спутники. Радикальная эволюция продукта при сохранении корневой компетенции — способ пережить любой рынок.", d:"Основанная в 1880-м как производитель деревянных вёдер, Ball прошла через стеклянные банки для консервирования (те самые Ball mason jars), жестяные и алюминиевые банки — до Ball Aerospace, строившей спутники и инструменты для космических телескопов. Каждый переход — добровольная смерть старого продукта до того, как он умер сам, при сохранении корневой компетенции в точном производстве ёмкостей и материалов. Мораль О'Райли: продукты смертны, компетенции — нет; компания, определяющая себя через способность, а не через продукт, способна пережить любой рынок."},
  {impl:true, th:"narayandas", s:"Black and Decker", t:"Строй стратегию-айсберг: держи большую часть элементов «под водой» — клиент их чувствует, а конкурент не видит. <q>Create elements in your strategy the customer feels and experiences... but competition cannot see</q>.", d:"В кейсе DeWalt конкурент Makita увидела только видимую часть — жёлтый цвет (<q>nothing but yellow Decker</q>) — и два года не отвечала, пока доля рынка утекала. Видимые элементы (цвет, цена, реклама) копируются мгновенно; невидимые — сервисная система, присутствие на стройплощадках, отношения с трейдсменами — конкурент даже не распознаёт как стратегию. <b>Применение:</b> проведи аудит своей стратегии — какие элементы конкурент видит и может скопировать, а какие клиент только чувствует; сознательно наращивай вторую категорию."},
  {impl:true, th:"narayandas", s:"Black and Decker", t:"<q>Meeting the customer for the first time at the negotiating table — you have lost the race</q>: там единственная оставшаяся переменная — цена. Встречай клиента в момент, когда он только начинает поиск.", d:"Разбор customer journey в кейсе DeWalt: продавцы «тусовались» на гонках в Дейтоне и стройплощадках, где живут их трейдсмены, а не стояли у полки в Home Depot. Кто вошёл в диалог на этапе поиска, формирует критерии выбора; кто появился на переговорах — торгуется только о цене. <b>Применение:</b> закартируй, где твой клиент реально начинает поиск решения, и обеспечь присутствие там — до тендера и до стола переговоров."},
  {th:"narayandas", s:"Black and Decker", t:"Чем сильнее заработок человека зависит от продукта, тем эмоциональнее (а не рациональнее) покупка: <q>The more your life depends on something, the more emotional you get</q>.", d:"Контринтуитивный механизм из кейса: профессиональный трейдсмен — казалось бы, самый рациональный покупатель — выбирает инструмент под давлением сообщества, потому что коллеги засмеют за «домашний» бренд Black &amp; Decker. Компании ошибаются, считая профессиональные и B2B-покупки рациональными по умолчанию, и не различают, где решение определяют эмоциональные, а где рациональные факторы."},
  {impl:true, th:"narayandas", s:"Black and Decker", t:"Партизанский маркетинг: при равном бюджете заходи в рынки по одному — <q>When you concentrate your effort you can shout louder than anybody else</q>. Громко в одном городе лучше, чем тихо по всей стране.", d:"Вместо лобовой национальной кампании против Makita DeWalt концентрировала усилия точечно — город за городом, стройплощадка за стройплощадкой: концентрация даёт экспоненциальную отдачу, а размазанный по стране бюджет делает тебя <q>only as loud as everybody else</q>. <b>Применение:</b> при ограниченных ресурсах не распыляйся — выбери один рынок, добейся доминирования и заметности там, затем переходи к следующему."},
  {th:"narayandas", s:"Black and Decker", t:"Провал нового бренда — оружие конкурента против всего твоего бизнеса: рынки не изолированы, поэтому риск запуска считай не потраченными деньгами, а ущербом для системы.", d:"Обсуждение риска запуска DeWalt: если бы новый бренд провалился, конкурент рассказывал бы клиентам Black &amp; Decker в других сегментах — «они сами себе не доверяют: сменили имя и провалились». Цена неудачи не равна инвестициям в запуск — она включает подрыв доверия к материнскому бренду во всех сегментах, где он работает."},
  {th:"narayandas", s:"Black and Decker", t:"Трейдсмен покупал не инструмент, а гарантию не потерять дневной заработок: 48-часовой ремонт, подменный инструмент, money-back. <q>Customers don't buy a quarter-inch drill, they buy a quarter-inch hole</q> (Левитт).", d:"Ядро кейса про features vs benefits: настоящий бенефит почти никогда не совпадает с тем, что компания считает своим продуктом. DeWalt продавал не качество и не мощность, а обещание «ты никогда не простаиваешь» — для человека, чей дневной заработок зависит от работающего инструмента, именно это и есть продукт."},
  {th:"narayandas", s:"Black and Decker", t:"60% годовых продаж DIY-инструмента в США происходят за одну неделю — перед Днём отца. <q>Every father in the US has 7 power tools, none of which they ever use</q>.", d:"Число, ломающее калибровку: в DIY-сегменте «качество» означает «приличный дешёвый подарок», а не надёжность в работе — инструментом всё равно не пользуются. Определение качества радикально различается по сегментам: тот же физический продукт для трейдсмена — источник заработка, для отца в подарок — символ. Отсюда невозможность обслуживать оба сегмента одним брендом."},
  {th:"narayandas", s:"Black and Decker", t:"Циники живут вечно, а причина их обиды могла давно исчезнуть: клиент 15 лет бойкотировал компанию из-за продавца, который 15 лет как уволился.", d:"История из разбора customer journey: к цинику бесполезно посылать продавца и бессмысленно давать скидку — его сопротивление не про цену и не про продукт. Сначала нужно выяснить источник обиды, и скорее всего окажется, что проблема — сама компания и её прошлое поведение, о котором внутри уже никто не помнит."},
  {impl:true, th:"narayandas", s:"Black and Decker", t:"Раздели спрос на три зоны ценовой чувствительности и работай асимметрично: нижнюю треть игнорируй — <q>the cost of winning the bottom part is extremely high</q>, верхнюю половину выигрывай всегда, в среднем поясе бери половину — это уже ~10% доли рынка.", d:"Мини-лекция после упражнения value mapping: победа в нижней, сверхчувствительной к цене трети слишком дорога и разбавляет бренд; в верхней половине, где ценность важнее цены, нельзя терять ни одного клиента. <b>Применение:</b> раздели своих клиентов по ценовой чувствительности и распредели усилия продаж асимметрично, вместо того чтобы одинаково биться за всех."},
  {impl:true, th:"narayandas", s:"Black and Decker", t:"Меняй ценовое восприятие клиента, а не свою цену: <q>How do I bring the customer to the price of where I am?</q> — вместо того чтобы спускаться к цене клиента.", d:"Ловушка, о которой предупреждает Нарайандас: <q>trying to go to the price where the customer is</q>. Механика подъёма клиента — не собственные заверения продавца, а адвокаты: бывшие чувствительные к цене клиенты, говорящие «я тоже сомневался, но ценность оказалась поразительной». <b>Применение:</b> собирай и подключай таких адвокатов к работе с ценовыми возражениями вместо скидок."},
  {th:"narayandas", s:"Black and Decker", t:"Не доказывай нечувствительным к цене клиентам, что цена не важна, — вызовешь подозрение: «я заказал стейк из конины — не надо убеждать меня, что конина это хорошо, иначе я насторожусь».", d:"Психологический механизм из той же ценовой мини-лекции: клиент, который уже готов платить, не нуждается в оправдании цены. Избыточные заверения работают в обратную сторону — сеют сомнение там, где его не было, точно как официант, настойчиво расхваливающий уже заказанное блюдо."},
  {th:"narayandas", s:"SK-II Going Global", t:"<q>You do not take brands global — you take the business model global</q>: за границу везёшь не продукт, а весь способ, которым клиент узнаёт, покупает и использует продукт.", d:"Центральный тезис кейса P&amp;G SK-II: бренд создаёт не банка крема, а система целиком — ТВ-охват для осведомлённости, beauty consultant в люксовом универмаге, обучение 7-шаговому ритуалу ухода и цена $150 как часть позиционирования. Экспортировать нужно всю эту систему; вырви один элемент — и «глобальный бренд» перестаёт работать."},
  {th:"narayandas", s:"SK-II Going Global", t:"Урезая «лишний» элемент модели ради низкой цены, можно вырезать сам источник успеха: Zimmer вышла в Азию с дешёвыми имплантами без сопровождения хирурга торгпредом — и провалилась.", d:"Иллюстрация тезиса о глобализации бизнес-моделей: успех Zimmer был не в импланте, а в человеке рядом с хирургом во время операции. Убрав сопровождение как «дорогое излишество» ради доступной цены для азиатского рынка, компания оставила продукт, но выбросила то, за что на самом деле платили клиенты."},
  {th:"narayandas", s:"SK-II Going Global", t:"Арифметика глобальной ниши: клиентка SK-II тратит ~$1000 в год — для $1 млн продаж в Китае нужна всего 1000 клиенток, для миллиардного бизнеса — 100 тысяч на весь мир.", d:"Число, меняющее калибровку при выходе на новые рынки: премиальной нише не нужен массовый локальный рынок. Задача — не адаптировать продукт под «среднего» местного потребителя, а найти в каждой стране небольшое число «своих» клиентов, не меняя ДНК сегмента: те же женщины, тот же ритуал, та же цена."},
  {impl:true, th:"narayandas", s:"SK-II Going Global", t:"Кантри-менеджеры всегда просят локализации — дисциплина глобальной модели в том, чтобы отвечать «нет», адаптируя только периферию: местная звезда в рекламе вместо японской, но не ядро модели.", d:"Типичный запрос звучит убедительно: «дайте другой цвет для Индии — продам больше», но каждая уступка размывает единую бизнес-модель. Ставка была огромной: сбой одного завода SK-II срезал EPS всей P&amp;G примерно на 15%. <b>Применение:</b> явно зафиксируй, что в модели — неприкосновенное ядро, а что — периферия для локальной адаптации, и держи право «нет» по ядру на глобальном уровне."},
  {th:"narayandas", s:"Cirque du Soleil - Blue Ocean", t:"Любой голубой океан со временем краснеет, поэтому цель стратегии — не найти голубой океан, а построить организацию, которая находит их снова и снова: <q>By the time the others catch up with your ocean, you are in a new blue ocean</q>.", d:"Нараяндас в кейсе Cirque du Soleil разводит два уровня: одноразовая находка голубого океана — это удача, а корпоративная стратегия — это способность повторять такие находки. Пока конкуренты копируют твой нынешний океан и превращают его в красный, ты уже должен плыть в следующем. Пример — Disney при Айгере: компания построила структуру, которая системно порождает новые голубые океаны, а не защищает один старый."},
  {impl:true, th:"narayandas", s:"Cirque du Soleil - Blue Ocean", t:"Самый сильный ход в голубой океан — изменить то, КАК люди покупают, а не что: <q>One way to find and play the blue ocean is: change how people buy</q>. Virgin Mobile сломала 2-летние контракты — через 6 месяцев Verizon «сам додумался» их отменить.", d:"Инкумбенты застревают в «единственно возможном способе продавать»: все 4 оператора США навязывали 2-летние контракты, и никто не мог первым отказаться от своей модели. Virgin Mobile купила ёмкость оптом у слабейшего игрока (Sprint) и запустила prepaid — модель покупки, которую отрасль считала невозможной. <b>Практика:</b> ищи в своей отрасли догму о том, как клиент «обязан» покупать (контракт, подписка, предоплата, канал), — и строй вход через её слом, а не через улучшение продукта."},
  {impl:true, th:"narayandas", s:"Cirque du Soleil - Blue Ocean", t:"Не определяй себя через отрасль: <q>The moment you say 'this is who we are', you trap yourself in a small box</q>. Определи себя через клиента и спроси: где ещё он ищет тот же восторг — и принеси это к себе.", d:"Сказав «мы цирк» или «мы жилая недвижимость среднего класса», компания запирает себя в маленькую коробку своей категории. Cirque du Soleil определил себя через восторг зрителя и посмотрел, где взрослый клиент ищет тот же восторг, — в театре и опере, откуда и принёс драму и сюжет в цирковое шоу. <b>Практика:</b> сформулируй, за каким переживанием клиент приходит к тебе, перечисли другие места, где он его покупает, и перенеси лучшие элементы оттуда в свой продукт."},
  {impl:true, th:"narayandas", s:"Cirque du Soleil - Blue Ocean", t:"Двойное преимущество: одновременно играй в дифференциацию и в снижение затрат — убирай то, за что клиент не готов платить, и на сэкономленное добавляй новые источники восторга.", d:"Классическая стратегия велит выбрать: либо дифференциация, либо издержки. Cirque du Soleil сделал и то и другое: убрал животных и звёзд — самые дорогие статьи классического цирка, за которые взрослый зритель не готов платить, — и вложил сэкономленное в драму, музыку и сценографию. Бонус: без звёзд и животных шоу можно клонировать, то есть отказ от лишнего ещё и делает бизнес масштабируемым. <b>Практика:</b> пройдись по статьям затрат и спроси о каждой — платит ли за это клиент; вырученное направь на новый источник восторга."},
  {th:"narayandas", s:"Cirque du Soleil - Blue Ocean", t:"Одержимость конкурентами перегружает продукт функциями: <q>When you obsess about competitors, you forget to ask: does the customer care?</q>", d:"Психологический механизм красного океана: стремясь «быть другим», компания начинает мерить каждую фичу относительно конкурента, а не относительно клиента. Так рождаются функции, за которые никто не платит, — продукт дорожает и усложняется, но восторга не добавляет. Это зеркальная сторона dual advantage: прежде чем добавлять отличие, спроси, важно ли оно клиенту."},
  {impl:true, th:"marketing", s:"Marketing sessions", t:"Сегментируй по кластерам выгод, а не по демографии: <q>The demographics was the death of the segmentation in this case</q>. Демографии место только на этапе доставки ценности — в закупке медиа.", d:"В кейсе Overtime Fitness (зал для подростков) Хартманн показывает, как рамка «13–18 лет» искусственно сжала рынок до 5-летнего окна, хотя выгода «железо + фан» гораздо шире. Демография — это про то, где найти клиента (медиазакупка), а не про то, какую ценность создавать. Единственное, что работает на обоих уровнях, — психографика: «геймеры» описывают и выгоду, и канал. <b>Практика:</b> при сегментации сначала кластеризуй по искомым выгодам, и только потом накладывай демографию для таргетинга."},
  {impl:true, th:"marketing", s:"Marketing sessions", t:"Позиционирование определяет цену: выбери, чьей альтернативой ты являешься. <q>As soon as I say what I am, I only need to highlight the things that are different from the thing that you recognize</q>.", d:"Для Overtime Fitness якорь «спортзал» и якорь «продлёнка» задают разный потолок цены и разный объём коммуникации. Назвав знакомую категорию, ты бесплатно наследуешь все её ожидания и цену — дальше объясняешь только отличия. <b>Практика:</b> перед запуском явно выбери референсную категорию, у которой самый выгодный ценовой потолок, и стройте коммуникацию как «знакомая вещь + вот наши отличия»."},
  {th:"marketing", s:"Marketing sessions", t:"Ценностное предложение = простое заявление + конкретное доказательство, в которое можно поверить: <q>Anybody can claim that they've got the world's greatest hamburgers. Show me something concrete that I can believe</q>.", d:"«Весёлый спортзал» может заявить любой — это пустая претензия, как «лучшие бургеры в мире». А видеоигры в зале Overtime — конкретика, на которую можно указать пальцем в рекламе: клиент сам делает вывод «там весело», вместо того чтобы верить на слово. Проверка ценностного предложения: есть ли в нём осязаемая деталь, которую можно показать, а не только заявить."},
  {impl:true, th:"marketing", s:"Marketing sessions", t:"Если модель «увольняет» клиента через 5 лет — <q>You literally fire your customers at year 5</q> — переопредели, кто клиент: школа, тренер или лига живут в рынке дольше и сами приводят новые когорты.", d:"Бизнес Overtime обречён жить на постоянном дорогом привлечении: подросток вырастает и уходит, LTV упирается в 5-летнее окно. Хартманн предлагает сменить единицу конверсии: продавать не подростку, а школе, тренеру или спортивной лиге — они остаются в рынке десятилетиями и сами подводят новые поколения детей. <b>Практика:</b> если у продукта естественный срок жизни клиента короткий, ищи в цепочке более долгоживущий узел и делай клиентом его."},
  {impl:true, th:"marketing", s:"Marketing sessions", t:"В покупке участвует цепочка ролей (инициатор, оценщик, плательщик, пользователь), и стартовать надо не с плательщика: <q>You gotta sell them and have them sell the parents — and they're experts at selling the parents</q>.", d:"Питч родителя ребёнку — «dead on arrival»: пользователь не купит идею, навязанную плательщиком. Зато дети — эксперты в продаже родителям: продай ребёнку игры, и он сам продаст родителям фитнес и репетиторство. <b>Практика:</b> распиши для своего продукта роли инициатора, оценщика, плательщика и пользователя и начинай продажу с той роли, которая сильнее всего влияет на остальных, а не с той, что держит кошелёк."},
  {th:"marketing", s:"Marketing sessions", t:"В кредитных картах «мёртвый» клиент — тот, кто платит вовремя: <q>The credit card industry has what they call deadbeat customers — they pay their bill on time, every time</q>. Часть клиентов рациональнее уволить.", d:"Контринтуитивный разворот из блока про value capture: идеальный по житейским меркам клиент — дисциплинированный плательщик — для банка убыточен, потому что никогда не платит проценты. Некоторых клиентов невозможно сделать прибыльными в принципе, и удерживать их — трата ресурсов; прибыльность надо считать по клиенту, а не по среднему."},
  {th:"negotiation", s:"The choice of negotiation", t:"Отказ поторговаться о стартовой зарплате стоит не 7%, а 7 лет жизни: непереговоривший работает на 7 лет дольше, чтобы догнать переговорившего, а к 35-му году карьеры разрыв превышает $100K в год.", d:"Нил сравнивает двух одинаковых выпускников: один поднял стартовый оффер, второй принял как есть. Организации дают прибавки процентом от базы, поэтому маленькая разница на старте консервируется и растёт как сложный процент. <q>How many more years will Frasier have to work? It turns out it's 7 years</q> — и это только чтобы догнать; к 35-му году разница уже больше $100K ежегодно. Цена одного несостоявшегося разговора измеряется годами работы, а не процентами оффера."},
  {th:"negotiation", s:"The choice of negotiation", t:"Парадокс правдивого: честно назвал свой bottom line — от тебя ушли. <q>You can't tell the truth teller from their evil twin, the liar</q> — наказывают именно честных.", d:"Контрагент не может отличить правдивое <b>«это мой предел»</b> от блефа: и честный, и лжец произносят одну и ту же фразу. Поэтому он продолжает давить и ждать уступок, а когда честный действительно не двигается — <q>it is the person who tells the truth, they're the ones who get walked away from</q>, да ещё и с обвинением в недобросовестности. Вывод Нил: раскрывать reservation price бессмысленно — правда в этой точке не верифицируема и потому не работает."},
  {th:"negotiation", s:"The choice of negotiation", t:"Политика «мы не торгуемся» убивает через самоотбор: Saturn продавал дороже ($600 премии, 60% покупателей — женщины), но продал мало и умер; Reddit без торга о зарплате нанимает только тех, кто не любит переговоры.", d:"Фиксированная цена Saturn нравилась тем, кто ненавидит торг у дилера, — покупатели платили премию около $600, — но таких оказалось слишком мало, чтобы бренд выжил. Reddit, отменив переговоры об офферах, получает тот же фильтр на входе: <q>Who are they going to select for? People who don't like to negotiate</q>. Второй скрытый эффект — <q>it reduces the pressure on the company to maintain comparability with the market</q>: без торгующихся кандидатов зарплатная сетка теряет привязку к рынку."},
  {th:"negotiation", s:"The choice of negotiation", t:"Смещение к согласию: ту же невыгодную опцию переименовали из «опции A» в «опцию соглашения» — и её стали выбирать в разы чаще. <q>The goal of the negotiation is not to reach a deal. The goal of the negotiation is to reach a good deal</q>.", d:"В эксперименте сам факт ярлыка «соглашение» делал плохой вариант привлекательным — люди тянутся к сделке как к цели, забывая проверить её качество. Именно этот механизм эксплуатирует фраза <b>«ещё одна уступка — и у нас сделка»</b>: она продаёт согласие, а не условия. Проверка от Нил: сделка хороша не потому, что она состоялась, а потому, что она лучше твоей альтернативы и близка к aspiration."},
  {impl:true, th:"negotiation", s:"The choice of negotiation", t:"Альтернатива — страховочная сетка, а не планка: меряя сделку «лишь бы лучше альтернативы», ты защитил низ, но уничтожил верх диапазона. Апсайд задаёт только aspiration.", d:"Типичная ошибка — судить приемлемость сделки по BATNA: любой результат чуть выше альтернативы кажется победой, и переговорщик останавливается у самого дна диапазона. Нил переворачивает роль альтернативы: <q>Rather than thinking about your alternative as a standard by which you judge acceptability, think about your alternative as a safety net</q>. Практика: перед переговорами фиксируй три числа — альтернативу (страховка), reservation price (порог выхода) и оптимистичную aspiration — и веди разговор от aspiration, а не от сетки под ногами."},
  {th:"negotiation", s:"The choice of negotiation", t:"Асимметрия власти полезна обоим: в паре «сильный + слабый» пирог больше, и слабый получает больше, чем каждый из двух слабых в паре. Страшен не сильный контрагент, а невозможность уйти: <q>If I cannot walk away, it's not a negotiation. It may be a hostage situation</q>.", d:"Контринтуитивный результат исследований: связки с асимметрией власти создают больший общий пирог, и даже слабая сторона в такой паре уносит больше, чем обе стороны в паре «слабый + слабый». Поэтому бояться сильного партнёра по переговорам не нужно — его сила работает и на тебя. Настоящая красная линия другая: пока у тебя есть право встать и уйти, это переговоры; исчезло право уйти — исчезли и переговоры."},
  {th:"negotiation", s:"The choice of negotiation", t:"Проси даже при «отрицательной зоне торга»: около 20% людей легко нарушают собственный reservation price — объективное отсутствие пересечения цен ещё не значит «нет».", d:"Reservation price на бумаге твёрд, а в жизни пластичен: Нил приводит покупателей, которые влюбились в дом дороже своего лимита — и лимит подвинулся. <q>About 20% of folks basically easily violate their reservation price</q>, поэтому расчёт «зоны согласия нет, спрашивать бессмысленно» ошибается примерно в каждом пятом случае: <q>maybe you should ask even when you think the answer is going to be no</q>."},
  {impl:true, th:"negotiation", s:"The choice of negotiation", t:"Реактивная девальвация: оффер, брошенный сразу «через стол», обесценивается просто потому, что исходит от противника. Тот же оффер после разговора об интересах воспринимается всерьёз.", d:"Механизм: <q>When I make an offer to you, because I'm across the table and I'm the other... you reject that as having anything good for you</q> — предложение дисконтируется по источнику, не по содержанию. Лекарство — сменить рамку с «противника» на «совместное решение задачи»: сначала обсудить интересы сторон, и только затем подать то же самое предложение со словами <b>«на основе нашей беседы — вот предложение»</b>. Содержание не изменилось, но исчез триггер девальвации."},
  {impl:true, th:"negotiation", s:"Getting (more of) what you want", t:"Калибровка подготовки: готовься минимум вдвое дольше, чем планируешь переговариваться, — 30 минут переговоров = час подготовки.", d:"Правило Нил перед ролевой игрой «рекрутер — кандидат»: <q>A good metric for how much time you spend preparing for a negotiation should be at least twice the amount of time you think you'll be negotiating</q>. Подготовка — это не прокрутка аргументов в голове, а расчёт альтернатив, reservation price и aspiration по каждому вопросу. Практика: ставя встречу-переговоры в календарь, сразу блокируй перед ней слот двойной длины на подготовку."},
  {impl:true, th:"negotiation", s:"Getting (more of) what you want", t:"Никогда не контруй собственный оффер: снизив цену без встречного предложения, ты сообщаешь <q>I can't let you walk away</q> — и вознаграждаешь контрагента именно за уход.", d:"Разбор игры: участник, не получив ответа, сам улучшил своё же предложение. Сигнал считывается мгновенно — раз он бидует против себя, уход работает: <q>What has he just rewarded me for doing? Not negotiating and walking away</q>. Теперь оптимальная стратегия контрагента — молчать и отходить дальше, собирая уступки бесплатно. Правило: после своего оффера — пауза; если тишина затянулась, проси встречное предложение, но не двигай собственную цену в одиночку."},
  {th:"negotiation", s:"Getting (more of) what you want", t:"<q>The correlation between objective performance and subjective assessment is negative</q>: фокус на aspiration даёт больше денег и меньше радости. Если после сделки необычайно хорошо — тревожный сигнал.", d:"Данные по итогам упражнения: чем лучше объективный результат, тем ниже удовлетворённость — амбициозная aspiration приносит больше, но оставляет ощущение «мог ещё». Обратная сторона важнее: эйфория после сделки часто означает, что умелый контрагент сдвинул твою точку отсчёта — например, экстремальным якорем, от которого любой исход кажется победой. Мерить сделку надо цифрами против подготовленных ориентиров, а не послевкусием."},
  {impl:true, th:"negotiation", s:"Getting (more of) what you want", t:"Себя фокусируй на aspiration, контрагента — на его альтернативе: превысив свою альтернативу, он доволен сделкой, связывает это чувство с тобой и охотнее вернётся переговариваться.", d:"Асимметричный приём Нил: сам сравнивай результат с амбициозной целью (это даёт больше), а партнёра мягко возвращай к вопросу «что у вас без сделки?» — на фоне альтернативы твоё предложение выигрывает. <q>Focus your counterpart on their alternatives... they will feel good about their negotiations... they're going to be more inclined to negotiate with you in the future</q>. Так одновременно забираешь больше ценности и строишь длинные отношения: контрагент уходит довольным и возвращается."},
  {impl:true, th:"negotiation", s:"Getting (more of) what you want", t:"Не принимай первый оффер — и не давай мгновенно принять свой: моментальное «да» запускает руминацию «что я упустил?» и эмпирически повышает шанс, что контрагент попытается выйти из сделки.", d:"Мгновенное согласие сообщает контрагенту, что его оффер не был экстремальным — значит, можно было больше, и он начинает жалеть о сделке вплоть до попытки её развалить. Рецепт Нил: <q>Make a counter. They'll negotiate with you. They'll get less and feel better</q> — контр-оффер парадоксально оставляет партнёру меньше денег и больше удовлетворения. Работает в обе стороны: даже на отличный оффер отвечай встречным, а свой первый оффер калибруй так, чтобы на него хотелось поторговаться."},
  {impl:true, th:"negotiation", s:"Getting (more of) what you want", t:"Правило первого оффера против фолк-мудрости «кто первый назвал цену — проиграл»: оба подготовлены — якори первым; ты подготовлен, он нет — пусть ошибётся первым; никто не подготовлен — делай первый и экстремальный.", d:"Логика по трём случаям: при взаимной подготовке первый оффер — чистый якорь в свою пользу; если не подготовлен только контрагент, его первый оффер может ошибиться в твою пользу; а когда не подготовлен ты сам, чужой якорь по тебе сработает наверняка, тогда как твой экстремальный оффер рискует лишь попасть в «crazy land». <q>You have a probabilistic bad versus a certain bad... take the probabilistic bad</q>. Практика: единственный сценарий «жди чужой цены» — когда преимущество в подготовке на твоей стороне."},
  {th:"negotiation", s:"Getting (more of) what you want", t:"Репутация «делителя пополам» провоцирует войну: если известно, что при трении ты делишь разницу, рациональный ответ контрагента — <q>Go crazy, extreme</q> на открытии. Приём для снижения конфликта увеличивает конфликт.", d:"«Давайте разделим разницу» ощущается как честный жест доброй воли, но как только он становится предсказуемым, меняет чужую стратегию открытия: <q>If I know that you are repeatedly willing to split the difference, what is my opening bid strategy?</q> — чем экстремальнее старт, тем выгоднее середина. В повторяющихся переговорах привычка сплитить систематически сдвигает точку деления против тебя и учит партнёров открываться всё агрессивнее."},
  {impl:true, th:"negotiation", s:"Getting (more of) what you want", t:"«Решим сначала лёгкие вопросы» и торг по одному пункту — стратегии разрушения ценности: ценность создаётся только пакетами через асимметрии приоритетов. В сложных сделках — чанки по 3-5 вопросов и финальная сборка в конце.", d:"Попунктный торг (классическая агенда юристов) превращает сделку в серию изолированных боёв: <q>Issue by issue negotiation... makes for eight separate battles</q> — и не оставляет места для размена «уступлю в неважном мне за важное». Стратегия «сначала лёгкое» <q>assumes that your easy issues are my easy issues</q> — а именно несовпадение приоритетов и есть сырьё для создания ценности. Практика: обсуждай вопросы связками по 3-5, соглашайся только на пакет целиком и оставляй финальную сборку всех условий на конец."},
  {th:"negotiation", s:"Getting (more of) what you want", t:"Миф фиксированного пирога заставляет проигрывать даже там, где спора нет: 15-20% участников «сплитят» вопросы, где обе стороны хотят одного и того же, — потому что не проверяют предположение «он наверняка хочет противоположного».", d:"В упражнении были congruent-вопросы — пункты, где интересы рекрутера и кандидата совпадают полностью. Тем не менее <q>typically between 15 and 20% of participants miss one or both of those</q>: убеждённые, что переговоры — всегда перетягивание каната, стороны идут на компромисс там, где обе могли получить максимум. Причина одна — <q>you never check</q>: предположение о противоположности интересов никто не проверяет вопросом."},
  {th:"negotiation", s:"Mobileye - Bargaining", t:"Асимметрия информации не помогает найти win-win — она убивает сделку: <q>when you have information, I don't, and I know you have information, my trust in your offer goes down</q>. Задача переговорщика — диффузировать приватную информацию, а не копить её.", d:"Разбор кейса Mobileye vs OEM: интуиция подсказывает, что знать больше другой стороны — преимущество, но Файнберг показывает обратное. Как только контрагент понимает, что у тебя есть приватная информация, любой твой оффер читается как игра на его незнании — и доверие к сделке падает. Поэтому сильные переговорщики не копят секреты, а сознательно выравнивают информацию: тест рынка, независимая оценка, <b>contingent contract</b>, где выплата привязана к будущим фактам, которые сейчас никто не знает."},
  {th:"negotiation", s:"Mobileye - Bargaining", t:"Мы никогда не говорим «да» первому офферу — но говорим «да» тому же офферу после сопротивления: <q>it feels better because the other side resisted</q>. Процесс переговоров создаёт ценность сделки не меньше, чем сумма.", d:"Психологический механизм из сессии по кейсу Mobileye: одно и то же число ощущается лучшей сделкой, если другая сторона сначала упиралась. Мгновенное согласие сигнализирует, что ты попросил слишком мало — и сделка, объективно та же, субъективно обесценивается. Отсюда следствие: сопротивление контрагента — не только препятствие, но и часть ритуала, который делает итоговое «да» устойчивым для обеих сторон."},
  {th:"negotiation", s:"Mobileye - Bargaining", t:"Большие корпорации — <q>where startups go to die</q>: покупка стартапа мгновенно создаёт богатых людей с нулевыми стимулами работать, и earnout-метрики этого не чинят.", d:"В обсуждении опции «OEM покупает Mobileye целиком» Файнберг объясняет, почему поглощения стартапов так часто разрушают ценность: в момент сделки основатели и ключевая команда становятся богатыми — и стимулы к сверхусилиям исчезают. Попытка починить это earnout-условиями работает плохо: люди формально пересиживают часы и добивают метрики, а не строят продукт. Поэтому цена стартапа для покупателя — это во многом цена команды, которая может перестать быть той командой сразу после закрытия сделки."},
  {th:"negotiation", s:"Mobileye - Bargaining", t:"Основатель продаёт компанию только в двух точках: <q>either things are so bad that you don't have a choice, or when you're way overvalued</q>. Если тебе продают — спроси, в какой из двух точек продавец.", d:"Жёсткая рамка Файнберга для оценки M&A-предложений: между «всё плохо» и «сильно переоценены» у рационального основателя почти нет мотивов расставаться с растущей компанией. Для покупателя это встроенный фильтр против winner's curse: сам факт готовности продать — сигнал о состоянии актива. Рамка симметрична — когда продаёшь сам, помни, что опытный контрагент читает твоё предложение так же."},
  {impl:true, th:"negotiation", s:"Mobileye - Bargaining", t:"Тайно узнал слабость контрагента — не разоблачай, а играй против его модели тебя: <q>they don't know that we know</q>. Незнание другой стороны о твоём знании — актив.", d:"История с сессии: переговорная команда обнаружила, что контрагенты, изнуряющие их марафонскими сессиями, сами тайком прячут еду в туалете — то есть тоже на пределе. Вместо разоблачения команда промолчала и ужесточила позицию: противник видел «истощённых, но несгибаемых» людей, его модель сломалась — и он уступил. Практика: обнаружив скрытую информацию о другой стороне, сначала спроси, что даёт больше — вскрыть её или тихо перестроить свою стратегию, пока контрагент играет против устаревшей картины тебя."},
  {th:"negotiation", s:"Games People Play", t:"Репутация — распределённый актив: она хранится <q>in small pieces distributed in other people's minds and hearts</q>. Формально это чужой прогноз твоего будущего поведения на основе известного им прошлого — поэтому управлять ей можно только видимыми действиями.", d:"Файнберг даёт репутации точное игровое определение: не «что я о себе думаю», а что другие предсказывают о моём будущем поведении, глядя на моё известное им прошлое. Из этого следуют два вывода: репутацию нельзя объявить или отредактировать напрямую — она обновляется только через наблюдаемые поступки; и она фрагментирована — у разных людей хранятся разные её куски, собранные из разных эпизодов. Это делает репутацию медленным активом: строится годами видимых действий, а разрушается одним."},
  {impl:true, th:"negotiation", s:"Games People Play", t:"Хочешь, чтобы человек пошёл против своей репутации, — предлагай приватно; хочешь, чтобы репутация заставила его исполнить обещание, — делай ставку публичной. <q>It's almost a mathematical proof that going private gives me a better chance than going public</q>.", d:"Следствие из игрового определения репутации: репутационная цена поступка существует только там, где есть наблюдатели. Приватный формат снимает эту цену — поэтому уступку, противоречащую публичному образу контрагента, надо просить один на один. И наоборот: если тебе нужно, чтобы обещание было исполнено, выведи его на публику — тогда репутация другой стороны начинает работать на тебя как механизм принуждения. Перед важным разговором выбирай формат (публичный или приватный) как переговорный инструмент, а не по привычке."},
  {th:"negotiation", s:"Games People Play", t:"Систематический баг самооценки: именно те, кто сам выбирает «драться», уверены, что другие драться не станут. <q>Think about the consistent statistical bias that we do about ourselves</q>.", d:"В аудиторном эксперименте с threat game (игрой входа) Файнберг из года в год видит один паттерн: группа, которая в роли инкумбента выбрала бы борьбу, при этом предсказывает, что другие инкумбенты сдадутся. Играя за себя, мы закладываем собственную агрессию и решимость; моделируя других — приписываем им спокойную рациональность. Это делает прогнозы чужого поведения систематически смещёнными: полезно проверять себя вопросом «а что бы сделал я на его месте?» — и не удивляться, если ответ страшнее модели."},
  {th:"negotiation", s:"Games People Play", t:"Фрейминг решает без изменения чисел: назови опцию «honorable» — большинство не сможет нажать «забрать всё»; назови то же «fiduciary responsibility to shareholders» — нажмут. В реальной сделке спроси: <q>Who does the framing for you?</q>", d:"В игре доверия (центипед) Файнберг показывает, что выбор людей переворачивается от одних лишь названий опций — платежи не меняются. Слово «honorable» удерживает от захвата денег, а формулировка про фидуциарную ответственность перед акционерами делает тот же захват морально разрешённым и даже должным. В реальных переговорах фрейминг почти никогда не нейтрален: слова, в которых тебе подали выбор, кто-то подобрал — и обычно не в твоих интересах. Первый шаг защиты — заметить рамку и переформулировать опции своими словами."},
  {th:"negotiation", s:"Games People Play", t:"Когда партнёр слишком настойчиво рассказывает, какой он честный, — <q>when it sounds like too much, probably something bad is happening there in the back</q>. Избыточная сигнализация добродетели — красный флаг, а не гарантия.", d:"Личная история Файнберга: он потерял венчур с кофаундером, который постоянно подчёркивал, какой он honorable, — и именно этот человек его подвёл. Механика проста: тому, кто действительно ведёт себя честно, редко нужно об этом говорить — за него говорят поступки и репутация; навязчивая вербальная сигнализация добродетели часто компенсирует то, что происходит за кулисами. Это не приговор каждому, кто говорит о ценностях, но повод усилить проверку фактов именно там, где слова о честности звучат громче всего."},
  {impl:true, th:"narayandas", s:"Taj Hotel - Ordinary Heroes", t:"<q>Talent is randomly distributed across the world. Opportunities are not</q>: Taj сознательно нанимает в малых городах, где таланту не досталось возможностей. Удерживает не зарплата, а благодарность за шанс.", d:"Разбор кейса «The Ordinary Heroes of the Taj»: рекрутинговая система Taj построена на talent-арбитраже — искать способных людей там, где рынок возможностей тонкий: малые города, а не столицы с перегретой конкуренцией за кадры. Человек, получивший шанс, которого ему «не полагалось», отвечает благодарностью — а благодарность создаёт лояльность и самоотдачу, которые не купить компенсацией. Практика: строя найм, спроси, где есть сильные люди, за которых никто не борется, — и стань для них той самой возможностью."},
  {th:"narayandas", s:"Taj Hotel - Ordinary Heroes", t:"<q>70 to 80% of guest contact is unscripted and unsupervised</q> — при 40–45 взаимодействиях на гостя в сутки. Поэтому нанимать нужно решателей проблем, а не исполнителей плейбука: скрипт физически не покрывает основную массу моментов истины.", d:"Число, которое меняет калибровку: в отеле уровня Taj на одного гостя приходится 40–45 контактов с персоналом за сутки, и 70–80% из них происходят без скрипта и без супервизора рядом. Значит, качество сервиса определяется не регламентами, а тем, как сотрудник сам решает в незакрытых сценарием ситуациях. Отсюда логика всей people chain Taj: отбирать по ценностям и способности думать, а навыкам учить — потому что контролем и плейбуком основную массу моментов истины не закрыть."},
  {th:"narayandas", s:"Taj Hotel - Ordinary Heroes", t:"Культура — это <q>how employees operate when pressure is on and no one is watching</q>. В теракте 26/11 сотрудники Taj без инструкций встали спинами к дверям, телефонистки вернулись в горящий отель, повара живой цепью выводили гостей — не сбежал ни один.", d:"Видео-кейс о теракте в Мумбаи 26.11.2008: <q>there were no manuals, there were no instructions</q> — самым простым было убежать самим, но сотрудники Taj закрывали гостей собой, и никто не покинул пост. Лектор подчёркивает: тот же паттерн сотрудники Taj показали в цунами 2004 года — значит, это не героизм одиночек, а воспроизводимый результат системы найма, обучения и признания. Настоящий тест культуры — не ценности на стене, а поведение людей в момент максимального давления без наблюдателей; всё остальное время культура лишь готовится к этому тесту."},
  {impl:true, th:"narayandas", s:"Taj Hotel - Ordinary Heroes", t:"Признание работает только быстрое и личное: в Taj особое поведение отмечается в течение 48 часов и непосредственным руководителем. Деньгами удерживать нельзя — <q>there will always be competitors who will pay people more</q>; признание скопировать нельзя.", d:"Третье звено people chain Taj — система признания: <q>if you recognize it in 48 hours, then you are encouraging that type of behavior</q>. Ключевые параметры — скорость (пока поступок жив в памяти) и источник (непосредственный руководитель, а не обезличенная система сверху). Логика против денежного удержания проста: зарплату конкурент всегда перебьёт, а культуру быстрого личного признания скопировать нельзя. Практика: заметил сильное поведение сотрудника — отметь его лично и в ближайшие двое суток, а не в годовом ревью."},
  {impl:true, th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Стратегия по сути — умение говорить «нет»: <q>People really understand that you are serious about strategy when you cancel projects</q>. В AMD поверили в стратегию Lisa Su не когда она запустила новое, а когда отменила неприкасаемые проекты.", d:"Разбор трансформации AMD: компания на грани банкротства распыляла ресурсы на десятки направлений, и никакие презентации стратегии не убеждали людей, что фокус — всерьёз. Переломным сигналом стала отмена проектов, которые считались священными: именно жертва, а не запуск, доказывает приоритеты. <b>Практика:</b> проверяй свою стратегию списком того, что ты явно отменил; если жертв нет — сотрудники справедливо не верят, что фокус настоящий."},
  {th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Из «rock star» в «country club» культура сползает незаметно годами, а обратный путь — «операция на открытом сердце». <q>The best thing that we can do is never become a Country Club</q>.", d:"Матрица культуры в кейсе AMD: «rock star» — высокие требования плюс высокое доверие, «country club» — доверие осталось, требовательность тихо испарилась. Дрейф вправо-влево несимметричен: расслабление никто не замечает, а возврат требовательности воспринимается как предательство и ломает людей — AMD пришлось пройти именно через такую хирургию. Отсюда вывод профессора: единственная дешёвая стратегия — не допускать сползания вовсе, потому что лечение всегда на порядок дороже профилактики."},
  {impl:true, th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Видение проваливается не от нехватки коммуникации: <q>It's not communication. The word is translation</q>. Каждый уровень менеджмента должен перевести стратегию в «что именно мне делать по-другому» — а для этого сначала интернализировать её сам.", d:"В кейсе AMD разбирается, почему повторение слов CEO вниз по иерархии ничего не меняет: менеджер, который транслирует чужие слайды, не отвечает на единственный вопрос подчинённого — что конкретно мне завтра делать иначе. Трансляция требует, чтобы руководитель сначала сам переварил стратегию и лишь потом переписал её в термины своего участка. <b>Практика:</b> после каскадирования стратегии спрашивай каждого менеджера не «донёс ли ты», а «что твоя команда теперь делает по-другому» — отсутствие ответа означает, что перевода не случилось."},
  {th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Главный скрытый мотор сопротивления переменам — страх «а смогу ли я?», который никто не озвучит: <q>They ask themselves: can I operate in that environment, can I learn the new skills? They will never tell you that</q>.", d:"Матрица «buy-in x способность меняться» из сессии AMD: «фрустрированные» верят в стратегию, но сомневаются в своих навыках, «безразличные» умеют работать, но не купились в идею. Лечение разное — первым нужны обучение и навыки, вторым объяснение и смысл, а универсальная «мотивационная» накачка не помогает никому. Коварство в том, что страх некомпетентности сотрудник маскирует под рациональную критику изменений, поэтому диагноз по словам не поставить — только по позиции человека в матрице."},
  {th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Вдохновляющая амбиция должна быть ступенькой, а не прыжком: Lisa Su публично сказала <q>We were not a good company... it would have to go in steps: from okay to good, from good to great</q> — и честное занижение первой ступени дало доверие, которого не даёт обещание величия.", d:"Вместо стандартной речи нового CEO про «мы станем великими» Lisa Su признала, что AMD — даже не good компания, и предупредила, что зарабатывать начнут не раньше чем через три года. Парадокс кейса: заниженная и честная планка мобилизовала людей сильнее громкой, потому что в неё можно поверить — а каждый пройденный этап подтверждал, что лидер говорит правду. Это переворачивает привычную логику вдохновляющих визий: доверие строится на достижимой первой ступени, а не на масштабе конечной мечты."},
  {impl:true, th:"narayandas", s:"AMD - Lisa Su Transformation", t:"«Красное — это хорошо»: <q>When somebody shows me that everything is green, I'm like: we obviously did not set aggressive enough goals</q>. Полностью зелёный дашборд — симптом заниженных целей, а не отличной работы.", d:"Операционный стиль Lisa Su из второй части кейса AMD: при амбициозных целях часть статусов обязана быть красной, поэтому идеально зелёный отчёт означает, что команда страхуется. Но правило работает только вместе с психологической безопасностью — люди должны сами поднимать руку «у меня red» и знать, что за честный красный не наказывают, иначе культура вернётся к украшению дашбордов. <b>Практика:</b> встречая полностью зелёный статус-отчёт, ставь под сомнение амбициозность целей, а не хвали команду; и явно поощряй тех, кто первым сообщает о красном."},
  {impl:true, th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Метрика зрелости твоей команды: <q>Number of decisions that your team escalates to you, divided by the number of decisions that your whole team makes</q> — эта доля должна падать со временем, даже когда компания растёт.", d:"Lisa Su измеряет не количество решений, которые принимает сама, а долю решений команды, доходящих до неё — так видно, научила ли она людей думать самостоятельно. Логика привязана к единственному ресурсу, который у всех одинаков, — времени: каждая лишняя эскалация съедает время CEO, которое нельзя купить. <b>Практика:</b> начни грубо отслеживать этот коэффициент по своей команде; если он не снижается — ты растишь исполнителей, а не руководителей, и проблема в том, как ты реагируешь на эскалации."},
  {impl:true, th:"narayandas", s:"AMD - Lisa Su Transformation", t:"<q>Most executives operate at the level of the symptom... whatever action plan you put together is not actionable</q> — «падает выручка» это симптом, и план из симптома даёт лишь временное облегчение. Постоянный вопрос Lisa Su: what is the problem?", d:"По оценке из кейса, больше половины руководителей строят планы действий от симптомов: лечат «падение выручки» скидками и активностью вместо поиска корня. Инструмент Lisa Su — упорно повторять вопрос «what is the problem?» и копать техникой «5 почему», пока не вскроется причина, из которой план становится действенным, а не косметическим. <b>Практика:</b> перед утверждением любого плана действий проверь, к чему он привязан — к симптому или к корневой проблеме; если формулировка проблемы звучит как метрика («падает X»), копай глубже."},
  {th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Главный вызов трансформации — «долина смерти»: все ждут линейного прогресса, но результаты сначала проседают, и именно в этот момент скептики приходят с «мы же говорили», а лидер начинает сомневаться в себе.", d:"Кривая трансформации из кейса AMD: после старта изменений показатели закономерно падают ниже исходных, прежде чем пойти вверх — а ожидания у всех линейные. В нижней точке совпадают два удара: <q>they come and tell you that you are wrong, and now you have your own self-doubts</q> — внешнее давление противников перемен накладывается на внутренние сомнения лидера, и большинство трансформаций умирает именно здесь. Знание формы кривой заранее — половина защиты: провал перестаёт быть сюрпризом и не читается как доказательство ошибки."},
  {th:"narayandas", s:"AMD - Lisa Su Transformation", t:"<q>If you underperform, you'll have a second chance. If you're generating drama, you don't get a second chance</q> — за честный недорезультат у Lisa Su второй шанс есть, за драму — нет.", d:"Правило топ-команды AMD: ошибка при честной работе разбирается без поиска виноватых — это цена амбициозных целей. Но внутренняя политика, инфайтинг и создание драмы выжигаются немедленно и без апелляций, потому что компания — командный спорт, и один политикан отравляет кооперацию быстрее, чем десять слабых исполнителей. Асимметрия сознательная: терпимость к риску плюс нулевая терпимость к токсичности — именно эта комбинация позволяет держать «red is good» без страха."},
  {impl:true, th:"narayandas", s:"AMD - Lisa Su Transformation", t:"Бюджетируй себя как портфель из четырёх ролей — Leadership, Expertise, Management и поле/клиенты — и сравни фактический календарь с должным: <q>Every time you see a negative number — you are borrowing from your greatness</q>.", d:"Финальное упражнение сессии: разложить своё время по четырём ролям лидера — Leadership (видение), Expertise (то, в чём ты уникален: коммодити-навыки получают коммодити-цены), Management (getting things done) и работа в поле с клиентами. Затем поднять фактическую аллокацию календаря за три месяца и сопоставить с целевой — разрывы обычно шокируют: management съедает время, которое должно идти в видение и экспертизу. <b>Практика:</b> проведи аудит своего календаря за квартал по этим четырём корзинам; каждая отрицательная дельта — конкретное место, где ты одалживаешь у собственного будущего."},
  {impl:true, th:"narayandas", s:"Titan Cement - Digital Transformation", t:"Сфокусированный пилот бьёт размазанные усилия на порядок: один завод Titan с IoT-датчиками дал +15% производительности, тогда как обычные программы годами выжимают 1–2% издержек.", d:"Кейс цифровой трансформации Titan Cement: вместо развёртывания технологий по всем заводам сразу компания поставила IoT-датчики на одном пилотном заводе и получила рост производительности на 15% — на фоне отраслевой нормы, где <q>некоторые выжимают годами, уменьшают издержки на 1–2%</q>. Только доказав эффект на пилоте, Titan пошёл в масштабирование. <b>Практика:</b> любую технологическую инициативу запускай как один концентрированный пилот с измеримым эффектом; масштаб — только после доказанного результата, а не параллельно с ним."},
  {impl:true, th:"narayandas", s:"Titan Cement - Digital Transformation", t:"Идти от проблемы, а не от технологии: <q>есть проблема — возможно, нет технологического решения — они инвестируют деньги, находят партнёров и решают</q>. Большинство внедряет ИИ там, где легко, и в конце лишь констатирует факт.", d:"Разбор Titan противопоставляет два пути цифровизации: типовые компании внедряют ИИ в аналитику и отчётность — туда, где просто, — и получают красивую констатацию фактов без эффекта на производстве. Titan шёл в обратном порядке: сначала конкретная производственная проблема, и если готового решения на рынке нет — инвестиции и поиск партнёров под неё. <b>Практика:</b> формируй цифровой портфель от списка самых дорогих производственных проблем, а не от списка модных технологий; отсутствие готового решения — повод искать партнёра, а не менять проблему на более удобную."},
  {th:"narayandas", s:"Titan Cement - Digital Transformation", t:"Кризис-менеджер — не менеджер роста: CEO, 26 лет героически выводивший Titan из кризисов, получает от класса «C» — <q>он лучший кризис-менеджер, но не думал про рост</q>. Умение выживать не конвертируется в умение расти.", d:"Класс оценивал многолетнего CEO семейной Titan Cement — единственного выжившего цементника Греции, проведшего компанию через череду кризисов. Контринтуитивный вердикт: несмотря на героическое выживание, оценка «C» — за 26 лет не появилось ни устойчивого роста, ни маржи, ни подготовленного преемника. Кейс разводит два разных типа лидерства: навыки спасателя и навыки строителя роста — и показывает, что многолетний успех в первом легко маскирует полный провал во втором."},
  {th:"narayandas", s:"Titan Cement - Digital Transformation", t:"Даже предельное commodity можно вывести из ценовой конкуренции: цементная компания декларирует <q>мы должны выйти из commodity и предлагать клиенту не продукт, а решение</q> — solutions, а не цемент.", d:"Цемент — эталонное commodity, где конкуренция сводится к цене и логистике, и именно поэтому заявление Titan звучит как разрыв шаблона: продавать клиенту решение его задачи, а не тонны продукта. Смена рамки с продукта на solution — способ уйти от ценовой войны там, где дифференциация продукта физически невозможна. Если solutions-логика работает в цементе, аргумент «у нас commodity, нам некуда дифференцироваться» теряет силу практически в любой отрасли."},
  {th:"finance", s:"Private Equity and Shareholder Maximization", t:"Короткий горизонт активиста — не идеология, а срок денег его LP: <q>If they have given you money for a short period of time, you cannot afford to live for 10 years in those companies</q>. Поведение инвестора определяется структурой его пассивов.", d:"Seru объясняет, почему ранние активисты выходили из компаний через считанные месяцы: их контракты с limited partners были короткими, и жить в позиции годами они физически не могли. Когда ValueAct и другие фонды выторговали у LP более длинные деньги, их горизонт в компаниях тут же удлинился. Урок шире активизма: прежде чем судить о «жадности» или «терпеливости» любого инвестора, смотри на структуру его пассивов — она, а не характер, задаёт горизонт."},
  {impl:true, th:"finance", s:"Private Equity and Shareholder Maximization", t:"Нет ковенанта — значит, риск уже оплачен ставкой: что не запретил в договоре, за то взял плату. <q>No one forced you to get into this contract... if you entered into a legal agreement on your own voluntary basis, you priced the debt</q>.", d:"В кейсе LBO Bell Canada старые держатели долга не вписали change-of-control covenant — и суд отказал им в защите: искушённый кредитор, добровольно подписавший договор, уже заложил этот риск в цену. Долг ценится двумя рычагами: либо <b>ковенанты и низкая ставка</b>, либо <b>свобода заёмщика и высокая ставка</b>. Практика: в любом долговом (и шире — любом) контракте явно реши, какие риски запрещаешь ограничениями, а какие продаёшь через цену; и не рассчитывай на защиту от риска, который сам оставил незапрещённым."},
  {th:"finance", s:"Private Equity and Shareholder Maximization", t:"Рынок наказывает «законное, но неэтичное» ростом будущей стоимости капитала — и обратный тест: <q>The fact that there was no retribution to KKR tells you the market thinks this is totally fine</q>.", d:"Механизм, на котором держится вся логика shareholder maximization: если кредиторы сочтут ход заёмщика шейди, все следующие займы для него подорожают — <q>if you other lenders agree this is unethical, you're going to charge me higher rates</q> — и выгода акционеров испарится. Отсюда рыночный тест этичности: KKR не понесла никакой кары за субординацию старого долга, значит рынок счёл приём нормой. Репутационная цена капитала — встроенный регулятор там, где закон молчит."},
  {th:"finance", s:"Private Equity and Shareholder Maximization", t:"Форма выплат управляет аппетитом к риску: акционер у края банкротства рационально идёт в «Вегас» — <q>If it pans out, I make a lot. If it doesn't work out, who cares — I was at zero anyway</q>, а кредитор с кэпом на доход не сыграет никогда.", d:"Seru разбирает конфликт держателей долга и акционеров в перегруженной долгом компании: у акционера опционный профиль — весь апсайд его, даунсайд уже съеден, поэтому азартная ставка рациональна; у кредитора доход зарезан сверху, и любой риск для него — чистый минус. Из этой асимметрии вырастает дизайн контрактов VC и PE: опционный профиль дают тому, от кого хотят <b>swing for the fences</b>, liquidation preference — когда боятся даунсайда. Аппетит к риску — не черта характера, а функция кривой выплат."},
  {th:"finance", s:"Private Equity and Shareholder Maximization", t:"Средний private equity уже почти не бьёт индекс — альфа осталась у топов: TPG даёт <q>about 12% over S&P 500 over a 15–20 year horizon</q>, и примерно треть этого — просто леверидж.", d:"Калибровка по источникам доходности PE: у лучших фондов раскладка (совпадающая с оценками McKinsey) — около трети от левериджа (50–60% долга против ~25% у средней публичной компании), треть от операционных изменений и треть от governance и длинного неликвидного горизонта. То есть даже у звёзд заметная часть «мастерства» — это структура капитала, а не операционная магия, а средний фонд после комиссий индекс уже почти не обыгрывает."},
  {th:"finance", s:"The Rise of Activism", t:"Рынок ценит не план активиста, а вероятность его исполнения: тот же пакет 5% и тот же план у звезды двигают цену с $5 к $9, у новичка — не двигают вовсе: <q>The market puts zero chance that I'll be able to convince the shareholders to go with me</q>.", d:"Seru прогоняет мысленный эксперимент с двумя активистами, идентичными во всём, кроме трек-рекорда: при объявлении позиции Jonas'а с репутацией цена прыгает почти до стоимости исправленной компании, при объявлении no-name — стоит на месте. Цена реакции рынка = план, помноженный на вероятность, что ты его продавишь через совет и акционеров. Репутация здесь — не украшение, а множитель, без которого рынок ставит на тебя ноль."},
  {th:"finance", s:"The Rise of Activism", t:"Валюта активизма — не размер пакета, а внимание крупнейших акционеров: <q>They happened to get two board seats on ExxonMobil's board with 0.1% shares</q>.", d:"Engine No.1 с пакетом всего 0,1% провела двух директоров в совет ExxonMobil, потому что у пенсионных гигантов CalPERS и CalSTRS уже был запрос на энергопереход, но не было плана — активист принёс план под готовый спрос. COVID и Zoom дали фонду доступ к встречам, недостижимым для «0,1%» в обычное время. Seru сразу остужает: <q>never again</q> — совпадение спроса, момента и доступа редко воспроизводимо, но сам механизм «маленький пакет + большие союзники» показателен."},
  {impl:true, th:"finance", s:"The Rise of Activism", t:"Лучшая защита от активиста — сыграть его атаку заранее: регулярные симуляции по трём рычагам playbook'а и постоянная коммуникация с акционерами, <q>so that when they arrive, it's not a fire drill on the day of — you have already practiced enough before</q>.", d:"Активист бьёт по трём рычагам — операционному, финансовому и governance, — и все три можно прогнать pre-mortem'ом до его появления: где он найдёт жир, что скажет про payout и долг, к чему придерётся в совете. Nooyi в Pepsi заранее продала акционерам разворот от сладких напитков — и агрессивный активист <q>couldn't make a dent</q>; участник SEP подтвердил тот же сценарий с Elliott и SoftBank. Практика: регулярно атакуй свою компанию глазами активиста и держи акционеров проданными на твою стратегию до того, как за них возьмётся кто-то другой."},
  {th:"finance", s:"The Rise of Activism", t:"Большой пакет активиста — это экономика портфеля кампаний, а не только голоса: <q>When you do make money, you want to make enough to more than make you whole across all the campaigns</q>.", d:"Кампании дороги — консультанты, юристы, 294 слайда Starboard по Darden — и большинство из них проваливается. Поэтому размер позиции диктуется не потребностью в контроле, а математикой выживания фонда: выигрышная ставка должна окупить все проигранные. Смотря на концентрацию позиций любого фонда, полезно спрашивать не «сколько ему нужно голосов», а «какая ставка окупает его портфель провалов»."},
  {th:"finance", s:"The Rise of Activism", t:"Активизм, PE и VC не растут в странах с тонким фондовым рынком по механической причине: <q>When markets are not very deep, leakage will happen — you're giving away value. It's the same with private equity and venture capital: exit and entry</q>.", d:"На мелком рынке цена убегает уже при наборе позиции — рынок «узнаёт Jonas'а» по первой покупке, — и то же самое повторяется на выходе. Активисту, как и PE и VC, нужны глубокие рынки на входе <b>и</b> на выходе, иначе экономика кампании не сходится. Контринтуитивное следствие: в странах со слабым governance проблема может быть огромной, но именно там лечить её некому — механизм лечения требует той самой рыночной глубины, которой нет."},
  {th:"innovation", s:"Developing a Business Model I", t:"Конфликт платящего и неплатящего пользователя встроен в саму рекламную бизнес-модель, а не в характер основателя: <q>It's not Facebook, it's all these companies</q>.", d:"Мендельсон разбирает Facebook: рекламодатель платит, пользователь — нет, и модель вынуждает максимизировать вовлечённость, а лучше всего вовлекает поляризующий контент. Проблема не в злой воле конкретной компании — <q>you have to do it if your business model is based on advertising</q>: любая компания с такой моделью придёт к тому же. Значит, скандалы вокруг платформ — предсказуемое следствие архитектуры модели, а не случайный сбой этики."},
  {impl:true, th:"innovation", s:"Developing a Business Model I", t:"Логика бизнес-модели нужна не чтобы объяснить, почему она сработает, а чтобы получить список условий для проверки, почему она НЕ сработает.", d:"Третий элемент бизнес-модели — логика: «если верны такие-то условия, модель работает». Мендельсон переворачивает её назначение: <q>the main implication is actually to test... and take the opposite view: why is it not going to work</q>. <b>Практика:</b> выпиши явным списком все условия, на которых держится твоя модель, и иди тестировать каждое как гипотезу — как Airbnb проверял, пустят ли незнакомца переночевать и доверятся ли люди платежам через платформу."},
  {th:"innovation", s:"Developing a Business Model I", t:"Сам путь итераций бизнес-модели — источник конкурентного преимущества: в процессе ты добываешь проприетарные <q>nuggets of information</q>, которых нет у строящих по общедоступным данным.", d:"Мендельсон подчёркивает: <q>the process is as important as the destination</q>. Пока компания итерирует модель, она узнаёт неочевидные вещи о клиентах и рынке, которые невозможно вычитать из открытых источников. Поэтому скопировать итоговую модель можно, а накопленное по дороге знание — нельзя: клон получает форму без содержания и отстаёт на каждом следующем повороте."},
