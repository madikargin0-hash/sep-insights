  {th:"innovation", s:"Developing a Business Model I", t:"Тест хлопьев: <q>if you make more money selling cereal, then your core business is a problem</q> — побочный бизнес прибыльнее основного значит у основной модели структурный дефект.", d:"Ранний Airbnb продавал брендированные хлопья Obama O's и Cap'n McCain's — и они приносили больше денег, чем аренда жилья. Для Мендельсона это диагноз: у event-based модели (жильё под конференции и события) было два структурных дефекта — низкая частота использования и необходимость каждый раз строить рынок в новом городе заново. Осознав это, команда перешла на travel-based модель, где спрос постоянный, а рынок в городе строится один раз."},
  {th:"innovation", s:"Developing a Business Model I", t:"Калибровка силы моделей монетизации: Facebook снимает почти $70 с пользователя в квартал (США), <q>просто соединяя людей</q>, Netflix с миллиардами на контент — около $60, Substack с прямой оплатой — порядка $15.", d:"Мендельсон сравнивает выручку на пользователя в США: <q>Netflix... spend billions and billions of dollars creating content... maybe $60 per quarter. Facebook, connecting people — almost $70</q>. Рекламная модель на чужом контенте монетизирует лучше, чем дорогой собственный контент, и в разы лучше прямых подписок Substack. Вывод: выбирая модель, ты выбираешь порядок величины монетизации — и вместе с ним встроенные конфликты этой модели."},
  {th:"innovation", s:"Developing a Business Model I", t:"Гуманоидные роботы выигрывают не качеством решения задач, а тем, что мир уже построен под человеческую форму: преимущество в скорости адопции бьёт преимущество в оптимизации.", d:"Мендельсон отмечает: <q>specialized robots can do a better job almost by definition</q> — специализированный робот почти по определению эффективнее универсального. Но гуманоиду не нужна новая инфраструктура: двери, лестницы, инструменты уже под него. Тот же аргумент объясняет, почему беспилотники делают в форме обычных машин под существующие дороги. Барьер адопции часто важнее технического совершенства продукта."},
  {th:"innovation", s:"Developing a Business Model I", t:"Chasm — не маркетинговая проблема, а принудительная смена бизнес-модели: мейнстрим требует другой модели, чем ранние последователи, и приходится ломать то, что ты только что с болью отладил.", d:"<q>When we run out of early adopters, we have to change our business model... and that's painful, because we finally figured out something that works</q>. Мендельсон показывает это на Tesla: для покупателей Roadster цена, себестоимость и производственные мощности не значили почти ничего, а на Model 3 те же параметры стали вопросом жизни и смерти компании. Пропасть Мура — это откат «на клетку 2–3»: заново собирать модель под прагматиков, а не докручивать маркетинг старой."},
  {impl:true, th:"innovation", s:"Developing a Business Model I", t:"Сетевые эффекты тревел-бизнеса считаются по парам городов, а не по точкам: входи на рынок не чтобы выиграть его, а чтобы не потерять смежные.", d:"Ценность Airbnb живёт в связках «откуда — куда», поэтому <q>if Wimdu dominates Europe, it would hurt Airbnb's business in the United States</q>: клон, захвативший Европу, разрушил бы американский бизнес Airbnb. По той же логике Airbnb шёл в Китай не ради победы на китайском рынке: <q>if you don't go into China, you might lose your business in Japan</q> — и Юго-Восточную Азию, куда едут китайские туристы. <b>Практика:</b> оценивая экспансию, считай не потенциал самого рынка, а какие связанные рынки потеряешь, отдав его конкуренту."},
  {th:"innovation", s:"Developing a Business Model I", t:"Координационная бизнес-модель даёт скрытую опцию устойчивости к шокам: <q>in the case of Airbnb it's electrons, and electrons move pretty fast</q>.", d:"Когда пандемия сдвинула спрос из центров городов в пригороды и малые города, отелям для ответа нужно было строить здания и заново нанимать персонал — их модель сидит на физических активах и людях. Airbnb ничего не строил: предложение хостов само перетекло за спросом, платформа лишь координировала. Замена владения активами координацией — это не только экономия капитала, но и встроенная адаптивность: модель перестраивается со скоростью движения информации, а не строек."},
  {th:"innovation", s:"Developing a Business Model I", t:"Прагматик — это обжёгшийся прогрессив: требование <q>покажи референс-клиента как я и 100%-решение</q> рождается из прошлого опыта раннего последователя, который однажды поверил и пострадал.", d:"Мендельсон объясняет психологию мейнстрим-сегмента: <q>that mindset very often comes from somebody who used to be a progressive and got burned: never let that happen to me again</q>. Консерватизм прагматика — не врождённая черта, а выученная защита. Полезная линза для чтения B2B-закупщика: его скепсис — след конкретного прошлого ожога, и продавать ему надо снятие именно этого риска, а не видение будущего."},
  {impl:true, th:"strategy", s:"Organizational Growth by Design", t:"Не решай рыночную и техническую неопределённость одновременно — <q>you have to roll doubles</q>: это перемножение вероятностей провала.", d:"Барнетт разбирает Webvan: компания одновременно выясняла, хотят ли люди заказывать продукты онлайн (рыночная неопределённость), и решала логистику последней мили (техническая) — вероятности успеха перемножились, и шансов почти не осталось. Контрпример — биотех: рынок для работающего лекарства гарантирован, вся ставка на технологию, неопределённость одна. <b>Практика:</b> проектируй венчур так, чтобы в каждый момент открытым оставался один тип неопределённости, а второй был закрыт или отложен."},
  {impl:true, th:"strategy", s:"Organizational Growth by Design", t:"Отделяй обучение от масштабирования: при больших фикс-костах сначала модульно сожми проблему до одного узла и пройди кривую обучения там, а уже потом тиражируй.", d:"Webvan построил пять распределительных центров сразу — со знаниями из самого начала кривой обучения: <q>those distribution centers were set up with the knowledge they had here, not with the knowledge they had here</q>. Горькая ирония: в день банкротства компания впервые вышла в плюс в Bay Area — единственном месте, где кривую успела пройти. <b>Практика:</b> прежде чем фиксировать дизайн в дорогом масштабе, доведи один узел до работающей экономики — тиражировать надо выученное решение, а не первоначальную гипотезу."},
  {th:"strategy", s:"Organizational Growth by Design", t:"Расти, чтобы найти product-market fit, — смертельно: <q>when you fail, you don't fail fast and cheap, you fail big and expensive</q>.", d:"Барнетт формулирует правило порядка: сначала fit, потом масштаб. Кто масштабируется до product-market fit, превращает дешёвые быстрые эксперименты в большие дорогие провалы — а обучение через большие дорогие провалы компания не переживает, потому что каждая итерация сжигает капитал масштаба. Рост — усилитель уже найденной модели, а не инструмент её поиска."},
  {th:"strategy", s:"Organizational Growth by Design", t:"Growth hack накачивает воронку, но без вовлечённости всё вытекает через churn: <q>signing up is a growth hack, engagement is the dog eating the dog food</q> — если корм заталкивать собаке в глотку, собака умирает.", d:"Вирусный рост требует заражаемости и восприимчивости (C×S>1), но хак решает только регистрацию — удержание решает продукт. Барнетт приводит студенческий Perfect Match, взорвавшийся и сдувшийся, и дуэль DeRemate против Mercado Libre: даже сетевой эффект, добытый хаком, эфемерен без retention, а Mercado Libre, выращивавший вовлечённых пользователей страна за страной, в итоге победил. Метрика роста без метрики вовлечённости — самообман."},
  {th:"strategy", s:"Organizational Growth by Design", t:"Литература о first-mover advantage построена на ошибке выжившего: быть первым на рынке — <q>one of the worst things you can do</q>, настоящее преимущество — быть первым к product-market fit.", d:"Барнетт указывает на методический дефект классических исследований: <q>they left out all the dead companies</q> — экономисты считали преимущество первопроходца по выжившим, выбросив из выборки погибших пионеров. Первый на рынке бесплатно ставит эксперимент для последователей, которые учатся на его ошибках. Ценна не хронологическая первость, а первость к работающей модели: <q>being first at product market fit is an awesome advantage</q>."},
  {th:"strategy", s:"Organizational Growth by Design", t:"Большой устоявшийся бизнес — подушка, и это хорошая и плохая новость одновременно: он амортизирует твои провалы и тем самым лишает тебя чистого рыночного сигнала.", d:"<q>The beauty of having a big established business is it cushions you from market failures... the bad news is that it cushions you from market failures</q>. Барнетт противопоставляет фокус и диверсификацию: сфокусированная компания сразу чувствует провал эксперимента — рынок бьёт напрямую, а у диверсифицированной убыток растворяется в общем результате, и она не узнаёт вовремя, что гипотеза провалилась. Красота фокуса — именно в чистоте рыночного сигнала."},
  {th:"finance", s:"Financing Innovation - Strategic value creation", t:"Ответ — не число, а модель: итоговая цифра NPV заведомо неверна, ценность в самой финмодели. <q>It's not about getting any number. It's about the financial model we built — that's the answer.</q>", d:"ДеМарзо строит полную NPV-модель нового продукта и сразу оговаривается: все допущения — прогноз продаж, доля рынка, издержки — наверняка ошибочны, поэтому гнаться за «правильной» цифрой бессмысленно. Настоящий результат упражнения — сама модель: она показывает, откуда берётся ценность проекта, какие допущения двигают результат сильнее всего и где сидят главные риски. Именно это говорит менеджеру, куда направить энергию — какие переменные проверять, чем управлять и за чем следить после запуска."},
  {impl:true, th:"finance", s:"Financing Innovation - Strategic value creation", t:"Запускай модель задом наперёд: не «какая у нас будет доля рынка», а <q>what would I have to believe to justify this</q> — и проверь это убеждение об историю.", d:"Вместо прогнозирования входных параметров ДеМарзо предлагает обратный ход: зафиксировать NPV=0 и вычислить, какое допущение требуется, чтобы проект имел смысл. В его примере проект окупался только при доле рынка 12,5% — а ни один прошлый продукт компании к такой доле даже не приближался, что убивает проект до старта. <b>Практика:</b> для каждой крупной инициативы выписывай критическое убеждение, которое должно оказаться правдой, и сверяй его с фактической базой (свои прошлые запуски, аналоги рынка) — это дешевле и честнее, чем спорить о прогнозах."},
  {th:"finance", s:"Financing Innovation - Strategic value creation", t:"Самое ценное решение — когда остановиться, а не когда начать: <q>Often the most valuable decision the company makes is when to stop doing stuff, not about starting stuff.</q> Staging с правом убить проект превращает «ужасный бизнес» в NPV-положительный.", d:"Кейс разработки лекарства: шанс успеха 1 из 3300 при затратах $76M — наивный NPV говорит «ужасный бизнес». Но инвестиции идут этапами, и после каждой фазы испытаний компания вправе остановиться; если считать NPV на каждом шаге с учётом опции выхода, каждый этап оказывается положительным. Деньги делаются не на старте, а на отборе выживших: ценность создаёт дисциплина убивать проекты по мере поступления плохих новостей, а не смелость их запускать."},
  {impl:true, th:"finance", s:"Financing Innovation - Strategic value creation", t:"Без постмортема NPV-процесс вырождается: <q>People will just cook up whatever numbers are needed to get their favorite projects off the ground.</q> Подотчётность за заявленный прогноз — условие работы всего метода.", d:"NPV-дисциплина держится не на математике, а на организационном контуре: если после запуска никто не сверяет прогноз из инвестзаявки с фактом, авторы быстро понимают, что цифры ничего не стоят, — и начинают подгонять их под любимые проекты. <b>Практика:</b> закрепи ритуал пост-аудита — через заданный срок после запуска сравнивать фактические результаты с NPV-моделью из заявки, с публичным разбором и авторством прогноза. Смысл не в наказании, а в том, что сама неизбежность сверки дисциплинирует допущения на входе."},
  {impl:true, th:"finance", s:"Financing Innovation - Strategic value creation", t:"Ранжируй проекты по NPV на единицу истинно дефицитного ресурса: для Qualcomm это не деньги, а инженеры. <q>For them, it's never about budgeting. The resource constraint is talent.</q>", d:"Классический capital rationing предполагает, что узкое место — бюджет, но у сильной компании деньги найдутся: у Qualcomm проекты конкурируют не за капитал, а за инженеров. Тогда правильная метрика отбора — NPV на одного инженера (profitability index по дефицитному ресурсу), а не абсолютный NPV. <b>Практика:</b> определи, какой ресурс реально ограничивает твой портфель — люди, внимание фаундера, производственные мощности — и ранжируй проекты по ценности на его единицу; бонусом эта же цифра показывает, сколько экономически стоит нанять ещё одного носителя дефицитного ресурса."},
  {th:"finance", s:"Financing Innovation - Strategic value creation", t:"Уровень анализа должен соответствовать качеству данных: <q>If you have great data, use it. If you don't have great data, don't pretend you do.</q>", d:"На вопрос про Monte Carlo ДеМарзо отвечает разграничением: в нефтеразведке симуляции уместны — там богатые геологические и исторические данные задают реальные распределения. В high-tech ключевые входы субъективны, и тысяча прогонов поверх выдуманных распределений лишь изображает точность, создавая ложную уверенность. Честнее три сценария «на глаз» — пессимистичный, базовый, оптимистичный: они дают ту же интуицию о разбросе, не маскируя, что в основе лежат суждения, а не данные."},
  {th:"finance", s:"Finance of Disruption and Corporate Innovation 2.0", t:"Инкумбенты банкротятся <q>gradually, and then suddenly</q>: пока адопция ползёт по низу S-кривой, игнорировать её рационально — и именно это убивает. У Yellow Pages в презентации 2005 года на 650 страниц не было слова «интернет»; через два года компания рухнула.", d:"Стребулаев показывает механику дизрапции через S-кривую адопции: на раннем плоском участке новая технология выглядит нишевой игрушкой, и для менеджера инкумбента рационально не тратить на неё ресурсы — цифры этого не оправдывают. Но экспоненциальный участок наступает быстрее, чем успевает перестроиться большая организация, и «постепенно» мгновенно превращается во «внезапно». Yellow Pages — чистый пример: за два года до краха в 650-страничной презентации для инвесторов интернет не упоминался ни разу; слепота была не глупостью, а следствием рациональной по-квартальной логики."},
  {th:"finance", s:"Finance of Disruption and Corporate Innovation 2.0", t:"Инкумбента нельзя заменить, став эффективнее его: <q>The way to replace an incumbent is not to become more efficient than the incumbent, but to come up with something different.</q> Сетевой эффект съедает любое улучшение внутри той же модели.", d:"Студенту с алгоритмом «на 50% лучше Waze» Стребулаев велел искать другой проект: по закону Меткалфа ценность сети растёт с квадратом числа пользователей, и никакое техническое превосходство не перебивает установленную базу инкумбента в той же категории. Замещение приходит только с другой бизнес-моделью: craigslist не проиграл «лучшему craigslist» — его разобрали по вертикалям Tinder, Zillow и другие, каждый со своей моделью. Урок: конкурировать с сетевым инкумбентом лоб в лоб бесполезно, атаковать надо сбоку, меняя саму логику продукта."},
  {th:"finance", s:"Finance of Disruption and Corporate Innovation 2.0", t:"Асимметрия сожаления в венчурной ставке: <q>If you lose, you lose 1x your money. If you miss Google, you lose 10,000x.</q> Venture mindset боится не провала, а пропущенного хоумрана.", d:"Формула Билла Гёрли фиксирует асимметрию выплат при power law: максимум потерь по сделке — вложенный капитал (1x), а цена упущенного выброса уровня Google — 10 000x. Поэтому рациональный венчурный инвестор оптимизирует не долю успешных сделок, а вероятность не пропустить хоумран — и спокойно принимает череду списаний. Это зеркально противоположно корпоративной логике, где наказывают за убытки и премируют за отсутствие провалов: та же психология, приложенная к дизраптивным ставкам, гарантированно отфильтрует именно те проекты, ради которых всё затевалось."},
  {impl:true, th:"finance", s:"Finance of Disruption and Corporate Innovation 2.0", t:"Веди анти-портфель: фиксируй отклонённые комитетом проекты и регулярно проверяй, что с ними стало. У топ-фонда анти-портфель оказался успешнее портфеля — <q>I'm concerned that we are sliding towards mediocrity.</q>", d:"Обычная отчётность видит только принятые решения, поэтому качество отбора деградирует незаметно: ошибки типа «упустили выброс» нигде не учитываются. Партнёр топ-фонда завёл анти-портфель — список сделок, дошедших до комитета и отклонённых, с регулярной сверкой их дальнейшей судьбы — и обнаружил, что отвергнутые компании в сумме обгоняют купленные: процесс отбора скатывался в посредственность, и вскрыли это только данные анти-портфеля. <b>Практика:</b> фиксируй каждый проект, идею или кандидата, отклонённых на финальной стадии, и раз в период проверяй их фактический исход — это единственная петля обратной связи по ошибкам пропуска."},
  {th:"finance", s:"Finance of Disruption and Corporate Innovation 2.0", t:"Холодные письма работают там, где ищут выбросы: <q>About 10% of all successful deals, and in fact the most successful deals, come from cold calls.</q> У топ-инвестора ассистент обязан разбирать папку «Спам».", d:"Эксперимент Стребулаева — 50 фейковых стартапов и 83 000 холодных писем реальным венчурным инвесторам — дал 8–15% позитивных ответов: канал, который в корпоративном мире считают мусорным, в венчурном открыт. Причина в power law: если один пропущенный выброс стоит дороже тысячи впустую прочитанных писем, читать всё входящее рационально. Доведённый до предела пример — топ-инвестор, чей ассистент обязан разбирать папку «Спам»: около трети его ответов фаундерам уходит именно из спама."},
  {th:"finance", s:"Finance of Disruption and Corporate Innovation 2.0", t:"Венчурная статистика «1 хит из 20» действует и внутри корпораций: <q>If you remove the names, there will be no difference between my venture data and Netflix's film data.</q> Дизраптивный контур надо мерить по правилам фонда, а не по KPI ядра.", d:"Стребулаев сравнивает распределение исходов венчурного фонда и проектов Netflix: без подписей данные неотличимы — примерно один из двадцати фильмов становится блокбастером, остальные окупают себя или проваливаются. У Alphabet минимум 20 проектов с инвестициями от $50M закрыты как провалы — и это признак работающего дизраптивного контура, а не плохого менеджмента. Следствие: корпоративный инкубатор, гордящийся «у нас нет провалов», на самом деле не делает ставок нужного масштаба — его надо оценивать по портфельной логике фонда (наличие хоумранов), а не по KPI операционного ядра (отсутствие убытков)."},
  {th:"ai", s:"Artificial Intelligence", t:"Под капотом любой «магии» ИИ — одна и та же задача: оптимизация, подбор параметров, минимизирующих ошибку. <q>Here's the real magic behind artificial intelligence and it's just optimization</q>.", d:"Кохендерфер показывает, что curve fitting, классификация изображений и LLM с 500 млрд параметров — это одна и та же оптимизационная задача разного масштаба. Понимание этого убирает мистику из любых разговоров про «AI-магию» в продуктах: за громкими словами всегда стоит минимизация функции ошибки."},
  {impl:true, th:"ai", s:"Artificial Intelligence", t:"TCAS — 1799 страниц псевдокода, которые не понимает целиком ни один живой человек; замена ACAS X считает таблицу POMDP-оптимизацией за 7 минут и даёт 50-кратный рост безопасности. Усилия людей — на метрики и trade-offs, правила пусть выводит оптимизатор.", d:"Авиационная система предотвращения столкновений TCAS десятилетиями обрастала ручными правилами под edge cases — <q>there's no one who has ever lived or is alive today who understands how this works</q>. В ACAS X подход перевернули: <q>you focus the human effort on figuring out what are the relevant metrics and how do we make trade-offs</q>, а конкретные решения выводит оптимизатор. <b>Как применить</b>: в своих системах не писать руками правила под каждый крайний случай, а формализовать метрики и компромиссы между ними — и отдать вывод правил оптимизации."},
  {th:"ai", s:"Artificial Intelligence", t:"Оптимум, противоречащий интуиции, — не обязательно баг: «странный клин» в решении оптимизатора инженеры сочли ошибкой и «исправили» — и в миллионе симуляций стало хуже. Прежде чем править странность модели, проверь, не умнее ли она тебя.", d:"В таблице решений ACAS X оптимизатор оставил зону, где система молчит почти на одной высоте с нарушителем. Кохендерфер признаётся: <q>I thought this must be a bug... but I filled it in and then ran a million simulations. And it did worse</q>. Оказалось, клин выполнял умную функцию — <q>it prevents you from committing to a direction that you later have to reverse</q>: не давал системе рано коммититься к манёвру, который потом пришлось бы разворачивать."},
  {th:"ai", s:"Artificial Intelligence", t:"Юберлинген-2002: бортовая система сказала «climb», диспетчер-человек — «descend», пилот послушал человека — 71 погибший. Самый смертельный сценарий human-AI системы — не ошибка машины, а неразрешённый конфликт её инструкции с инструкцией человека.", d:"Кохендерфер разбирает катастрофу как провал дизайна взаимодействия: <q>You have a robot voice telling you to do one thing and a human voice telling you to do the opposite</q>. Реверс манёвра, который спас бы ситуацию, блокировала <q>one line of code in that 1799-page document that inhibits reversals in exactly this situation</q>. Урок для любых систем с человеком в контуре: протокол разрешения конфликта «машина против человека» важнее точности каждой из сторон по отдельности."},
  {th:"ai", s:"Artificial Intelligence", t:"Прорыв пришёл оттуда, куда эксперты не смотрели: <q>for many decades, until 2022, real AI researchers didn't really take chatbots very seriously</q> — и топовые NLP-профессора были удивлены ChatGPT сильнее обывателей. Консенсус экспертов — плохой фильтр для будущих прорывов.", d:"С Элизы 1966-го до 2022-го чат-боты считались несерьёзной темой, а ЛеКун ставил язык примерно на 300-е место из 500 по важности для интеллекта. Про реакцию коллег на ChatGPT Кохендерфер говорит студентам: <q>they were probably even more surprised than you all were</q>. Вывод: отсутствие интереса экспертов к направлению — не доказательство его тупиковости."},
  {th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"Трансформативный ИИ — задача дизайна, а не прогноза: <q>We should not think about this as a social science prediction problem. Instead, we should think of it as a design problem</q>.", d:"Главный тезис лекции Райха: не жди, что социологи предскажут, что случится с рынком труда из-за AI. Последствия технологии не «случаются» сами — их определяют решения лидеров, которые её строят и внедряют. Смена рамки с «что произойдёт?» на «что мы спроектируем?» возвращает ответственность тем, кто принимает решения."},
  {th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"<q>Where you get your hair done has a deeper professional orientation than AI developers</q> — у косметологов есть лицензии и ответственность, а в AI нарушение норм улучшает репутацию, а не разрушает её.", d:"Райх сравнивает: в косметологии — лицензирование и санкции, в CS — ACM-кодекс, за нарушение которого за 40+ лет наказали один раз, и нет аналога IRB для data science. Хуже того: <q>violating norms helps your reputation in AI rather than harming your reputation</q>. Профессиональная незрелость поля — это рычаг, а не приговор: нормы ещё не застыли, и их можно формировать."},
  {th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"Профессиональное сообщество может остановить технологию без единого закона: добровольный мораторий Дудны на редактирование эмбрионов соблюдают, а единственного нарушителя наука «отлучила» — ни конференций, ни публикаций.", d:"После «кошмара с Гитлером» Дженнифер Дудна (CRISPR) объявила добровольный мораторий — и он держится на репутационных санкциях: китайский исследователь, нарушивший запрет, <q>was reputationally sanctioned for having violated a voluntary ban</q>. Контраст с AI Райх формулирует вопросом: <q>Can you think of anyone who has done something that only violated a norm of AI development and suffered a reputational cost for it? The answer is no</q>. Репутационные санкции — работающий механизм управления технологией, которого в AI пока нет."},
  {th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"<q>The Turing test is an invitation to deception</q>: сама цель «неотличимо от человека» заложила в отрасль курс на замену людей — автоматизация Маккарти победила аугментацию Энгельбарта.", d:"Райх прослеживает развилку: путь Маккарти (машина вместо человека) стал мейнстримом, путь Энгельбарта (машина усиливает человека) — маргиналией, хотя Apple с идеей «bicycle for the mind» — топ-2 компания мира. Инвесторы усиливают перекос: <q>Venture capitalists are always investing in the AI loom. Where are the AI cranes?</q> — финансируются «AI-ткацкие станки» на замену людям, а не «AI-краны» с человеком в контуре."},
  {impl:true, th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"Правило внедрения AI — «4 A»: разбей должность на ~10 задач и для каждой реши — Automate (автоматизировать), Augment (усилить человека), Avoid (сознательно оставить людям) или Add (добавить новую задачу на освободившееся время).", d:"Райх предлагает это как готовое упражнение вместо абстрактного «внедряем AI»: <q>Take your job and divide it into so-called tasks... automate, augment, avoid... and you could decide to add a new task</q>. <b>Как применить</b>: провести упражнение с командой — расписать каждую роль на задачи и по каждой явно выбрать одну из четырёх стратегий, включая осознанное решение оставить часть работы людям и добавить новые задачи на высвободившееся время."},
  {th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"Демократия регулирует с опозданием by design: железные дороги — 80 лет от диффузии до регулирования, телефон — 50, авиация — 20. Для AI регуляторное окно открыто прямо сейчас — всё <q>exactly on schedule</q>.", d:"Райх калибрует панику «регуляторы безнадёжно опоздали» историческим рядом: <q>80 years from commercial diffusion to regulation</q> для железных дорог, и таймлайны с каждой технологией сжимаются. При 700 млн недельных пользователей ChatGPT менее чем за 3 года <q>the regulatory window is open for AI</q> — это не провал демократии, а её нормальный ритм, и момент влиять на правила — сейчас."},
  {th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"Плохое AI-регулирование — вина самих технологов: экономист из Fortune 100 идёт в ФРС с потерей 95% дохода — так экономика получила грамотных регуляторов, — а CTO, готового на такой же tour of duty в правительстве, не найти.", d:"Райх указывает на условие мудрого регулирования: глубокое знание предмета у регулятора, которое профессия обязана поставлять сама. В экономике это норма: <q>95% of the people take a 95% pay cut and go to the Federal Reserve board</q>. В технологиях — нет: <q>Show me a chief technology officer who would do the same thing... that's your fault — not you personally, but you as a professional class</q>."},
  {th:"ai", s:"The Economic, Political, and Social Implications of Transformative AI", t:"Автоматизация entry-level ломает лестницу компетенций: партнёры McKinsey вырастают только из джуниор-аналитиков — автоматизируя их работу, фирма уничтожает конвейер собственных будущих лидеров.", d:"Райх разбирает эффект второго порядка на примере консалтинга: <q>The principals and partners in the firm got to where they are by being junior analysts... if I automate all the entry level stuff, how do I ever get it?</q> Краткосрочная экономия на джуниорах оборачивается тем, что через годы некому становиться сеньорами и партнёрами. Каждое AI-внедрение стоит проверять на этот скрытый удар по воспроизводству экспертизы."},
  {th:"leadership", s:"Handling Hot-Button Issues", t:"Моральное суждение рождается первым и интуитивно, а рациональные аргументы мозг достраивает задним числом: <q>We come to our judgment of what is right or wrong, and then we come up with our reasoning... in ways that agree with our initial intuition</q>.", d:"Лекция про hot-button issues строится на social intuitionist model: образ рационального «мыслителя Родена» — миф. В классе это показали упражнением про «съесть сбитую собаку»: вердикт «это неправильно» возникает мгновенно, а внятных аргументов у людей нет — moral dumbfounding. Отсюда вся дальнейшая логика сессии: спорить фактами с моральной интуицией почти бесполезно, работать нужно с самими интуициями."},
  {impl:true, th:"leadership", s:"Handling Hot-Button Issues", t:"Убеждай через моральные основания слушателя, а не свои: правых на вакцинацию двигает <q>coming together as a group to stand strong against this external threat</q> и слово авторитетов, левых — защита слабых от вреда. Одно сообщение на всех не работает.", d:"По moral foundations theory пять оснований — care, fairness, loyalty, authority, purity — весят по-разному у левых и правых, поэтому универсальный аргумент проигрывает таргетированному. Профессор разбирал это на собственном опыте: в феврале 2020 он писал главу о вакцинах и формулировал отдельные сообщения под каждую аудиторию. Практика: прежде чем убеждать, определи доминирующие моральные основания собеседника и переформулируй ту же просьбу в его координатах, а не в своих."},
  {impl:true, th:"leadership", s:"Handling Hot-Button Issues", t:"Ценности нельзя вшить в компанию задним числом: вопрос «что будем делать, если победим» надо решить до победы — <q>it's much easier to work out values issues early on and do them consistently</q>.", d:"На кейсе Meta/Facebook видно, как в гонке за масштаб компания думала о winner-take-all и лишь потом столкнулась с модерацией речи и выборами — встроить ценности ex post оказалось почти невозможно. Профессор проводит прямую параллель с сегодняшней гонкой ИИ, где игроки снова думают только о победе. Применение: ещё на старте зафиксируй, как организация будет вести себя в спорных ситуациях после успеха, и практикуй эти правила последовательно с первого дня."},
  {th:"leadership", s:"Handling Hot-Button Issues", t:"«Я самый рациональный в комнате» — иллюзия образованных: в ядерной лаборатории Livermore инженеров специально тренировали не спорить с протестующими, потому что учёные — такие же <q>gut instinct people</q>.", d:"Профессор вырос рядом с Lawrence Livermore Lab и вспоминал, как инженеры-ядерщики рвались «рационально» переубеждать протестующих. Их собственная позиция при этом тоже держалась на интуициях, а не на чистой логике — поэтому лаборатории приходилось отдельно учить их не вступать в споры. История калибрует главный тезис лекции: образование и экспертиза не отменяют интуитивной природы моральных суждений — ни у оппонента, ни у тебя."},
  {th:"leadership", s:"Handling Hot-Button Issues", t:"У модерации политической речи нет легитимного арбитра: ни борд компании из Кремниевой долины, ни правительства — <q>there are some countries where half of the population thinks the government is illegitimate at any given time</q>.", d:"Обсуждая кейс Meta, класс упёрся в проблему легитимности: почему совет калифорнийской корпорации вправе решать, что можно говорить о выборах в чужой стране? Передача решения государствам не спасает — во многих странах половина населения в любой момент считает собственную власть нелегитимной. Тезис спорный, но полезен как рамка: для части hot-button решений «правильного» института просто не существует, и сам выбор арбитра — уже ценностное решение."},
  {th:"finance", s:"Accounting for valuation and control", t:"«Cash is king» не работает для оценки бизнеса: квартальный EPS объясняет ~3% вариации доходности акций, а <q>cash from operations barely explains any</q>; на горизонте четырёх лет earnings очень информативны.", d:"Вводная сессия курса отвечала на вопрос, зачем вообще нужна финансовая отчётность, и это главное эмпирическое доказательство: информацию о стоимости несёт прибыль, а не денежный поток. Начисления сглаживают случайные колебания платежей и потому лучше отражают экономику бизнеса, а с удлинением горизонта объяснительная сила earnings заметно растёт. Калибровка: смотреть при оценке только на кэшфлоу — значит выбрасывать основной информационный сигнал."},
  {th:"finance", s:"Accounting for valuation and control", t:"Вопреки нарративу «бухучёт умер, всю стоимость создают intangibles», реакция рынка на earnings announcements за последние 20 лет не упала, а выросла: <q>investors have increasingly relied on earnings</q>.", d:"Популярный тезис гласит, что отчётность потеряла релевантность, потому что не капитализирует бренды, данные и R&D. Данные показывают обратное: чувствительность цен акций к объявлениям прибыли за два десятилетия усилилась — инвесторы полагаются на earnings всё сильнее, а не слабее. Хороший пример проверки модного нарратива измерением: «смерть бухучёта» опровергается поведением самого рынка."},
  {impl:true, th:"finance", s:"Accounting for valuation and control", t:"Обучение меняет P&L предсказуемым путём: владельцы малого бизнеса после курса маркетинга подняли прибыль через рост продаж, после курса бухучёта — через контроль издержек. Хочешь, чтобы команда управляла затратами, — научи её читать цифры.", d:"Профессор приводил полевой эксперимент: предпринимателям давали курс маркетинга или бухучёта, и прибыль выросла в обеих группах, но разными механизмами — <q>the people who got the accounting course improved their profits because they controlled their costs better</q>. То, чему учишь людей, определяет, какой рычаг прибыли они дёргают. Практика: если проблема компании в издержках, финансовая грамотность менеджеров — прямой инструмент воздействия, а не «гигиена»."},
  {th:"finance", s:"Accounting for valuation and control", t:"Стандарты отчётности — поле политической битвы: глава SEC пригрозил запретить отчётность по IFRS для кросс-листингованных в США компаний, если ISSB продолжит развивать sustainability-стандарты.", d:"Профессор, сам занимающийся sustainability reporting, рассказал этот эпизод как иллюстрацию того, что учётные стандарты — материя не техническая, а политическая: <q>if you keep going with your sustainability reporting standard, we are going to be considering whether we will allow IFRS for cross-listed companies in the US</q>. Противостояние US GAAP и IFRS — не спор бухгалтеров, а инструмент давления юрисдикций друг на друга. Для читающего отчётность это напоминание: сами правила игры формируются интересами регуляторов."},
  {th:"innovation", s:"Byte — bootstrap и дизайн бизнес-модели", t:"Отсутствие венчурных денег — оружие, а не слабость: прибыльный с первого дня бизнес в кризис получает опциональность — в COVID Byte удвоил мощности, пока конкуренты, поднявшие, по словам основателей, сотни миллионов без пути к прибыльности, резали персонал.", d:"Byte строился без внешнего капитала и, как рассказывали основатели, был прибылен с первого дня, поэтому пандемия стала для него не угрозой, а моментом атаки: <q>it's really important to be a self-sustaining business, because that provides optionality in the bad environment</q>. Пока залитые венчурными деньгами конкуренты проводили сокращения, Byte наращивал мощности и забирал рынок. Урок кейса: самоокупаемость — не отказ от роста, а купленное право действовать агрессивно тогда, когда остальные вынуждены выживать."},
  {impl:true, th:"innovation", s:"Byte — bootstrap и дизайн бизнес-модели", t:"Позволь чужим маркетинговым бюджетам строить твою категорию: на обдуманной покупке за $1000+ клиент сам сравнивает альтернативы, поэтому при той же цене клика конверсия Byte была, по словам основателей, порядка втрое выше, а CAC — около трети конкурентского.", d:"Основатели сознательно радовались, что <q>big participants in the industry spending a lot of marketing dollars to create awareness of the category</q>: на дорогой обдуманной покупке реклама конкурента приводит клиента не сразу к покупке, а в сравнение альтернатив. Byte выигрывал уже на этапе сравнения — продуктом, ценой и сервисом — и потому платил за привлечение заметно меньше при тех же ставках аукциона. Применение: в категории с длинным циклом решения оцени, где выгоднее стоять — платить за создание спроса или конвертировать спрос, созданный чужими бюджетами."},
  {impl:true, th:"innovation", s:"Byte — bootstrap и дизайн бизнес-модели", t:"<q>Everybody's approved</q>: вместо кредитных грейдов ABCD — единая ставка порядка 7% для всех; продавцы перестают бояться разговора о финансировании, и одобрения вместе с продажами растут.", d:"Byte финансировал клиентов сам и перевернул логику скоринга: не сортировать заёмщиков по риску, а одобрять всех на одинаковых условиях. При низкой себестоимости алайнеров даже неполные платежи слабых заёмщиков, по оценке основателей, добавляли порядка 20 процентных пунктов маржи, а продавец, которому больше не нужно сообщать клиенту отказ или «плохой грейд», продаёт свободнее. Применение: если COGS мал, посчитай — возможно, универсальное одобрение выгоднее, чем продажи, потерянные на скоринге."},
  {impl:true, th:"innovation", s:"Byte — bootstrap и дизайн бизнес-модели", t:"Раздавай прибыль команде живыми деньгами каждый месяц вместо бумажного эквити — люди начинают думать как собственники: <q>does it make sense to get another box of T-shirts and swag... or should we put it in our pocket?</q>", d:"Как только Byte стал зарабатывать, основатели начали ежемесячно распределять прибыль команде деньгами, а не опционами. Эффект — мгновенная обратная связь: каждый лишний расход сотрудник видит как деньги, вынутые из собственного кармана, и сам начинает резать ненужное. Применение: в прибыльном частном бизнесе регулярные денежные выплаты из прибыли дисциплинируют расходы сильнее, чем абстрактная доля, которая обналичится когда-нибудь при exit."},
  {impl:true, th:"innovation", s:"Byte — bootstrap и дизайн бизнес-модели", t:"Конечная цель определяет конструкцию компании: <q>our intention from the start, from day one, was to exit the business by the end of 2020</q> — и Byte, без борда и внешнего капитала, был продан Dentsply Sirona за сумму порядка $1 млрд.", d:"Основатели решили, «куда хотим прийти», до того как настроили компанию: план продажи к концу 2020 определил отказ от венчурного капитала и совета директоров — ничто не мешало быстрым решениям и не размывало долю. По словам основателей, цель была достигнута точно в срок, а сумма сделки — порядка миллиарда долларов. Применение: сначала зафиксируй end goal — продажа, дивидендный бизнес, IPO, — а затем выбирай структуру капитала и управления под него, а не наоборот."},
  {impl:true, th:"innovation", s:"Byte — bootstrap и дизайн бизнес-модели", t:"Истечение патентов инкумбента — окно для входа: идея Byte родилась за ужином с ортодонтом, сказавшим, что <q>the Invisalign patents [are] coming off... and it's going to open up the market to a bunch of new entrants</q> — следи за patent cliffs как за сигналом тайминга.", d:"Категорию clear aligners годами защищали патенты Invisalign, и их истечение предсказуемо открыло рынок волне новых игроков — Byte вошёл в это окно одним из первых с D2C-моделью. Тайминг был не удачей, а информированной ставкой: сигнал пришёл от отраслевого инсайдера ещё до открытия окна. Применение: в патентно-защищённых категориях отслеживай сроки истечения ключевых патентов и эксклюзивности — это календарь будущих точек входа."},
  {th:"leadership", s:"Introduction – Stress, Focus, and Human Performance", t:"Люди с просоциальным этическим кодексом — пунктуальность, честность, помощь другим — статистически счастливее. Хотя культура прощает и даже обожествляет плохое поведение, если оно ведёт к успеху: <q>we deify people who act terribly... if they're billionaires or heads of companies</q>.", d:"Лускин противопоставляет данные о счастье культурной норме: общество склонно извинять межличностную жестокость успешных людей — миллиардеров и глав компаний — и превозносить их, <q>but they might be awful as human beings</q>. Статистика при этом на стороне просоциальности: люди, которые держат слово, приходят вовремя и помогают другим, в среднем счастливее. Этика оказывается не ограничением на пути к благополучию, а его механизмом."},
  {th:"leadership", s:"Introduction – Stress, Focus, and Human Performance", t:"Чем чаще человек говорит «я, мне, моё» в свободном 10-минутном монологе, тем выше у него риск сердечно-сосудистых болезней: <q>the more the people refer to themselves... the higher the risk for heart disease was</q>. Самопоглощённость — кардиологический фактор риска.", d:"Лускин приводит исследование, где испытуемых просили просто говорить о себе десять минут, а затем считали частоту слов «I, me, mine». Оказалось, что степень самореференции предсказывает риск болезней сердца: постоянная фиксация на себе держит организм в напряжении. Обратная сторона того же механизма — смирение и внимание к другим работают как защитный фактор для здоровья."},
  {th:"leadership", s:"Introduction – Stress, Focus, and Human Performance", t:"Крупнейший предиктор ранней смерти — не давление и не холестерин, а слабые социальные связи: <q>the biggest predictor of premature death was lack of relationship... not high cholesterol</q>.", d:"Лускин ссылается на знаменитое лонгитюдное исследование Alameda County: при сравнении факторов риска отсутствие близких отношений предсказывало преждевременную смерть сильнее, чем классические медицинские показатели вроде холестерина. Это переворачивает привычную калибровку: инвестиции в отношения — не «мягкий» бонус к здоровому образу жизни, а самый весомый его компонент."},
  {th:"leadership", s:"Introduction – Stress, Focus, and Human Performance", t:"Волонтёрство — помощь чужим людям без личной выгоды — одно из немногих занятий, которое одновременно улучшает физическое здоровье и удлиняет жизнь: <q>there aren't many qualities that both are positive for our physical health and extend our lifespan as volunteering</q>. Помощь своей семье такого эффекта не даёт.", d:"Контринтуитивная деталь из данных Лускина: оздоровительный эффект даёт именно бескорыстная помощь посторонним, а не забота о своих. Помощь семье — это ожидаемая обязанность с элементом обмена, и независимого вклада в здоровье и долголетие она не добавляет. Работает именно выход за пределы собственного «я» ради людей, которые тебе ничего не должны."},
  {impl:true, th:"leadership", s:"Introduction – Stress, Focus, and Human Performance", t:"Перед тем как войти домой, остановись на минуту и реши, каким человеком ты сейчас войдёшь: <q>just before you walk in your door, stop... Do I want to be the same as I was at work? Hopefully not</q>.", d:"Практика перехода между ролями: рабочий день оставляет тело в режиме стресса, и без паузы ты вносишь его прямо в дверь — к своим людям, которые этого не заказывали. Лускин предлагает микроритуал: у порога остановиться, заметить, где ты находишься и к кому входишь, и сознательно выбрать состояние. <b>Как применять:</b> одна минута у двери — вдох, вопрос «хочу ли я войти таким же, каким был на работе?» — и только потом ручка двери; то же работает перед входом в переговорку или на созвон."},
  {th:"leadership", s:"Introduction – Stress, Focus, and Human Performance", t:"<q>Happiness is wanting what you have... Stress is wanting anything else</q> — счастье это хотеть то, что имеешь; стресс — хотеть что угодно другое.", d:"Лускин соединяет формулу Швейцера со своей добавкой: если счастье — хотеть то, что уже имеешь, то стресс по определению — желание чего угодно другого. Для консьюмерской культуры, приученной всегда хотеть следующее — следующую должность, покупку, метрику, — мысль радикальная: источник стресса не в обстоятельствах, а в самом векторе желания, направленном мимо того, что есть."},
  {th:"leadership", s:"Leading Team. Team Work", t:"Намерение не влияет на команду — влияет только impact: <q>your intent does not affect group performance... Your impact is the only thing that affects the performance of the group</q>. Если ты хотел возразить, а тебя услышали как поддержку — «прав» тот, кто услышал.", d:"В дебрифе командного упражнения профессор разбирает разрыв между тем, что участник хотел сделать, и тем, как его действие прочитала группа. На результат работает только прочитанное: возражение, услышанное как поддержка, для команды и есть поддержка. Мы привычно возвышаем свой intent над своим воздействием — «я же имел в виду другое» — и именно поэтому теряем влияние: группа реагирует не на замысел, а на эффект."},
  {th:"leadership", s:"Leading Team. Team Work", t:"Само присутствие других людей съедает когнитивный ресурс — эффект есть даже у тараканов: автоматизированные задачи в группе делаются лучше, творческие и новые — хуже. <q>If I want you to dig a ditch, I'm going to put you with a bunch of other people... If I want you to solve a complex math problem, I should have you working by yourself</q>.", d:"Классический эффект социальной фасилитации: присутствие других повышает возбуждение и отнимает часть внимания, поэтому отточенные, автоматические действия в группе ускоряются, а сложные и новые — деградируют. Эффект настолько базовый, что воспроизводится даже у тараканов. Отсюда правило распределения работы: рутину и «копание канавы» — командой, задачи, требующие свежего мышления, — в одиночку, и только потом сводить результаты вместе."},
  {impl:true, th:"leadership", s:"Leading Team. Team Work", t:"Неопределённостью надо управлять, а не устранять её: <q>you can spend a lot of time and energy trying to eliminate uncertainty as opposed to managing it</q>. Спрашивай «какой contingency-план мне нужен?», а не «как это выяснить?».", d:"В разборе планирования профессор показывает типичный process loss: незнание психологически некомфортно, поэтому команды сжигают часы на попытки узнать неузнаваемое — вместо того чтобы признать неопределённость данностью и работать с ней. <b>Как применять:</b> когда команда застряла на «нам нужно сначала выяснить», задай другой вопрос — можно ли это выяснить в принципе и за разумную цену; если нет, переключай обсуждение на contingency-план: что мы сделаем при каждом из реалистичных исходов."},
  {th:"leadership", s:"Leading Team. Team Work", t:"Люди охотятся за стимулом, а не за поведением, которое он должен поощрять: <q>people will try to find ways to get the incentive and not care about the behavior you want</q>. 3M довела Six Sigma до того, что бонусы платились за число «проектов эффективности», а не за эффективность.", d:"История-доказательство из блока о мотивационных потерях: в 3M внедрение Six Sigma привязали к бонусам за количество проектов эффективности — и люди начали плодить проекты ради проектов, вплоть до того, что компания перестала нормально функционировать. Механика универсальна: любой стимул измеряет прокси, и люди оптимизируют прокси, а не цель. Чем сильнее стимул, тем быстрее расходятся метрика и реальное поведение, которое ты хотел получить."},
  {th:"leadership", s:"Leading Team. Team Work", t:"С ростом команды мотивация падает не из-за неясности цели, а из-за неясности личного вклада: <q>it's not the clarity of the goal. It's the clarity of how you contribute to that goal</q>.", d:"Разбирая мотивационные потери больших команд, профессор уточняет привычный диагноз: лидеры лечат падение мотивации проговариванием целей, но цель обычно и так ясна. Теряется другое — человек перестаёт видеть, что именно меняет его работа, заметит ли её кто-нибудь и где границы его полномочий. Поэтому лекарство — не очередная презентация про миссию, а видимая связь «мой кусок работы → результат команды» для каждого участника."},
  {impl:true, th:"leadership", s:"Leading Team. Team Work", t:"Оппозиция — не конфликт: <q>opposition and conflict are not the same thing... opposition is necessary</q>. Команде нужны все четыре действия — move, support, oppose, reflect — примерно поровну и от каждого участника; без оппозиции команда дружно едет с обрыва.", d:"Модель поведения в команде из лекции: каждый вклад участника — это move (предложение), support (поддержка), oppose (возражение) или reflect (рефлексия о процессе), и здоровой группе нужен баланс всех четырёх от каждого, а не распределение ролей «этот всегда предлагает, тот всегда против». Оппозиция здесь — рабочая функция проверки решений, а не межличностный конфликт; без неё команда единодушно едет с обрыва, и все это видят. <b>Как применять:</b> отслеживай собственный репертуар на встречах — какого из четырёх действий у тебя почти нет — и сознательно добирай его; в своей команде легитимизируй oppose как обязанность, а не как нелояльность."},
  {impl:true, th:"narayandas", s:"TESSEI. Frontline Service Operations", t:"«Люди несчастны» — это симптом, а не проблема: <q>people are unhappy is a symptom... I need you to solve the problem</q>. Не лечи симптомы — сначала сформулируй решаемую проблему.", d:"Разбирая ситуацию TESSEI — клининговой компании синкансэнов с демотивированным фронтлайн-персоналом, — профессор останавливает класс на первом же шаге: «замотивируем людей» и «наймём ещё» — это лечение симптомов. Несчастные сотрудники, жалобы клиентов, текучка — всё это проявления, а не формулировки проблемы. <b>Как применять:</b> прежде чем обсуждать меры, потребуй сформулировать проблему так, чтобы она была решаемой; сама дистанция между симптомом и проблемой и есть путь к решению."},
  {th:"narayandas", s:"TESSEI. Frontline Service Operations", t:"<q>People come to you to either have a job, a career or a calling</q>: если твоя работа для людей — временный job, они не будут заботиться о клиентах, сколько ни увещевай. Никто не мечтает убирать поезда — проектируй систему исходя из этого факта.", d:"Рамка кейса TESSEI: люди приходят в организацию за одним из трёх — job (заработок), career (рост) или calling (призвание), и <q>if the only thing they want is a job — they will not care</q>. Уборка поездов по умолчанию — чистый job: никто о ней не мечтает, и требовать «сервисного отношения» от людей, пришедших пересидеть, бессмысленно. Урок TESSEI в том, что систему сервиса надо проектировать от этой реальности: либо перестраивать саму работу так, чтобы в ней появлялись элементы карьеры и гордости, либо не ждать заботы о клиенте от дизайна, рассчитанного на призвание, которого нет."},
  {th:"narayandas", s:"TESSEI. Frontline Service Operations", t:"<q>You never want to be a subsidiary of anybody. Because if you are a subsidiary of somebody, that means they don't understand</q> — материнская структура дочернюю компанию не понимает и недоинвестирует.", d:"Афоризм из разбора оргструктуры TESSEI: над двумя тысячами фронтлайн-сотрудников стоит топ-менеджмент головной JR East, для которой уборка поездов — периферийная дочерняя функция. Статус subsidiary означает, что решения о твоих людях, стандартах и инвестициях принимают те, кто твою операцию не понимает и не считает приоритетом. Отсюда хроническое недоинвестирование — не по злому умыслу, а по устройству: проблемы «дочки» всегда проигрывают конкуренцию за внимание материнской компании."},
  {impl:true, th:"narayandas", s:"TESSEI. Frontline Service Operations", t:"Прежде чем снижать стандарты — посчитай утилизацию: бригады TESSEI реально заняты 50–70% смены (<q>12 minutes of 24 minutes is 50%. So utilization is actually 50%</q>), значит проблема не в жёстких нормативах. Всегда знай, что именно ты решаешь.", d:"Интуитивный диагноз кейса — «людей загнали нормативами 7-минутной уборки» — рассыпается при простом счёте: из цикла в 24 минуты бригада реально работает 12, утилизация 50–70%, перегруза нет. Значит, ослаблять стандарты — решать не ту проблему; настоящая проблема в необученных и невовлечённых людях. <b>Как применять:</b> перед любым «смягчим требования» или «добавим людей» посчитай фактическую загрузку и явно сформулируй, <q>what we are solving for</q> — иначе будешь оптимизировать не то узкое место."},
  {impl:true, th:"todo", s:"The choice of negotiation", t:"«28:30 — надо послушать» — пометка на аудио/видео фрагменте.", d:"Недописанная пометка из конспекта лекции Маргарет Нил от 5 ноября: <q>28:30 — надо послушать</q> — отсылка к таймкоду аудиозаписи. Стоит она в разделе о цене неумения торговаться, между слайдом <q>зачем вам сотрудник, который не умеет вести переговоры?</q> и блоком Agreement ≠ Success — видимо, там прозвучал сильный фрагмент, который не успелось законспектировать. Чтобы закрыть пометку: найти запись этой сессии, отмотать на 28:30, прослушать фрагмент и дописать инсайт в заметку The choice of negotiation."},
  {impl:true, th:"todo", s:"Getting (more of) what you want", t:"«Главный предиктор успешного брака…» — фраза не окончена.", d:"Оборванная фраза из дебрифа Нил по игре про создание и захват ценности — но ответ в заметке-источнике есть: главный предиктор успешного брака — <b>общность целей и ценностей</b>. Нил использовала это как аргумент в пользу прямой стратегии на congruent-вопросах: когда отношения важнее денег, открытое признание, что нам нужно одно и то же, подчёркивает общность и строит доверие. Чтобы закрыть карточку, достаточно дописать окончание фразы — источник Getting (more of) what you want от 2025-11-05 уже содержит всё нужное."},
  {th:"todo", s:"Corporate Venture Capital", t:"«There was a correlation» — без продолжения.", d:"Обрыв из лекции Ильи Стребулаева о венчурных решениях: он описывал исследование на 500 часах аудио канадского Shark Tank — одна группа кодировала качество ответов основателей, другая, не зная, кто из участников инвестор, фиксировала только его реакцию. <q>There was a correlation</q> — и по контексту заметки связь именно в том, что проваленный ответ на red-flag-вопрос (размер рынка, команда) предсказуемо гасил интерес акулы. Чтобы дописать карточку: свериться с записью или слайдами (в заметке упомянута стр. 42 про red-flag-подход) и зафиксировать, между чем именно корреляция и насколько она сильна."},
  {th:"todo", s:"Disrupting a Market with New Technology", t:"#insight у фото 20251107_104419 без подписи.", d:"Пометка #insight стоит над фотографией слайда 20251107_104419 из лекции Уэсли Хартманна о выводе дисраптивного продукта на рынок (кейс Rachio, умные разбрызгиватели), но подпись к ней так и не написана. Судя по соседним записям, фрагмент был про hype cycle: новые технологии стартуют с пика ожиданий и падают, пока старые конкурируют ценой и ценностью. Чтобы закрыть: открыть фото в хранилище (если iCloud спрятал его как .20251107_104419.jpg.icloud — дождаться докачки), разобрать, что на слайде, и сформулировать инсайт одной-двумя фразами."},
  {th:"todo", s:"The Rise of Activism", t:"#insight у фото IMG-20251101-WA0205 без подписи.", d:"Пометка #insight у фото IMG-20251101-WA0205 из лекции Амита Серу об акционерном активизме — подписи нет. Рядом в конспекте разобран мысленный эксперимент про два мультиверса: активист покупает одни и те же 5% акций, но в одном мире цена растёт, а в другом падает — вся разница в том, верит ли рынок, что влияние активиста пойдёт компании на пользу. Чтобы дописать: открыть фото (это WhatsApp-снимок; при iCloud-эвикции искать .IMG-20251101-WA0205.jpg.icloud), понять, какой слайд или флипчарт на нём, и добавить подпись-инсайт в заметку The Rise of Activism."},
];

const themeName = Object.fromEntries(THEMES);
let activeTheme = null;
let query = "";
let implOnly = false;

const $list = document.getElementById("list");
const $chips = document.getElementById("chips");
document.getElementById("total").textContent = DATA.length;

// В песочнице claude.ai переходы на obsidian:// заблокированы CSP —
// там клик копирует название заметки; из локального файла ссылка работает напрямую.
const CAN_DEEPLINK = location.protocol === "file:";

function obsidianUrl(note) {
  return "obsidian://open?vault=nn&file=" + encodeURIComponent(note);
}

let toastTimer = null;
function copyName(name) {
  const done = () => {
    const t = document.getElementById("toast");
    t.textContent = "«" + name + "» скопировано — в Obsidian нажмите ⌘O и вставьте";
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(name).then(done, done);
  } else {
    done();
  }
}

function matches(item) {
  if (implOnly && !item.impl) return false;
  if (activeTheme && item.th !== activeTheme) return false;
  if (!query) return true;
  const hay = (item.t + " " + (item.d || "") + " " + item.s + " " + themeName[item.th]).toLowerCase();
  return query.split(/\s+/).every(w => hay.includes(w));
}

function render() {
  const found = DATA.filter(matches);
  $list.innerHTML = "";
  if (!found.length) {
    $list.innerHTML = '<p class="empty">Ничего не нашлось по запросу <b></b> — попробуйте короче.</p>';
    $list.querySelector("b").textContent = "«" + query + "»";
    return;
  }
  for (const [key, name] of THEMES) {
    const group = found.filter(i => i.th === key);
    if (!group.length) continue;
    const h = document.createElement("h2");
    h.className = "themehead";
    h.innerHTML = name + ' <span class="cnt"></span>';
    h.querySelector(".cnt").textContent = group.length;
    $list.appendChild(h);
    for (const item of group) {
      const c = document.createElement("article");
      c.className = "card";
      c.dataset.idx = DATA.indexOf(item);
      const p = document.createElement("p");
      p.innerHTML = item.t;
      const meta = document.createElement("div");
      meta.className = "meta";
      const left = document.createElement("span");
      left.className = "leftmeta";
      if (item.impl) {
        const b = document.createElement("span");
        b.className = "impl";
        b.textContent = "внедрить";
        b.title = "Помечено тегом #Implementation — правило действия";
        left.appendChild(b);
      }
      let det = null;
      if (item.d) {
        c.classList.add("hasd");
        det = document.createElement("div");
        det.className = "detail";
        det.innerHTML = item.d;
        const more = document.createElement("button");
        more.className = "morebtn";
        more.setAttribute("aria-expanded", "false");
        more.textContent = "Разбор кейса";
        left.appendChild(more);
        const toggle = () => {
          const open = c.classList.toggle("open");
          more.setAttribute("aria-expanded", String(open));
          more.textContent = open ? "Свернуть" : "Разбор кейса";
        };
        c.addEventListener("click", ev => {
          if (ev.target.closest("a")) return;
          if (window.getSelection && String(window.getSelection())) return;
          toggle();
        });
      }
      meta.appendChild(left);
      const a = document.createElement("a");
      a.className = "src";
      a.href = obsidianUrl(item.s);
      a.textContent = "→ " + item.s;
      a.title = CAN_DEEPLINK ? "Открыть заметку в Obsidian" : "Скопировать название заметки";
      if (!CAN_DEEPLINK) {
        a.addEventListener("click", ev => {
          ev.preventDefault();
          copyName(item.s);
        });
      }
      meta.appendChild(a);
      c.appendChild(p);
      if (det) c.appendChild(det);
      c.appendChild(meta);
      $list.appendChild(c);
    }
  }
}

for (const [key, name] of THEMES) {
  const n = DATA.filter(i => i.th === key).length;
  const b = document.createElement("button");
  b.className = "chip";
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = name + '<span class="n"></span>';
  b.querySelector(".n").textContent = n;
  b.addEventListener("click", () => {
    activeTheme = activeTheme === key ? null : key;
    for (const c of $chips.children) c.setAttribute("aria-pressed", "false");
    if (activeTheme) b.setAttribute("aria-pressed", "true");
    render();
  });
  $chips.appendChild(b);
}

const implChip = document.createElement("button");
implChip.className = "chip implchip";
implChip.setAttribute("aria-pressed", "false");
implChip.innerHTML = '✓ Внедрить<span class="n"></span>';
implChip.querySelector(".n").textContent = DATA.filter(i => i.impl).length;
implChip.title = "Только правила действия (#Implementation)";
implChip.addEventListener("click", () => {
  implOnly = !implOnly;
  implChip.setAttribute("aria-pressed", String(implOnly));
  render();
});
$chips.appendChild(implChip);

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById("rnd").addEventListener("click", () => {
  const pool = DATA.filter(matches);
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  render();
  const el = $list.querySelector('.card[data-idx="' + DATA.indexOf(pick) + '"]');
  if (!el) return;
  el.scrollIntoView({ block: "center" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
});

render();
</script>

</body>
</html>
